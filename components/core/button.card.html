<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../../styles.css"></head>
<body style="margin:0;padding:24px;background:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-family:var(--font-button)">
<button style="font-family:var(--font-button);font-weight:700;border-radius:50px;padding:20px 30px;font-size:var(--text-button-size);letter-spacing:var(--text-button-ls);border:1px solid var(--midnight);background:var(--midnight);color:#fff;cursor:pointer">Contact Us &amp; Enroll Today &rarr;</button>
<button style="font-family:var(--font-button);font-weight:700;border-radius:50px;padding:20px 30px;font-size:var(--text-button-size);letter-spacing:var(--text-button-ls);border:1px solid var(--midnight);background:transparent;color:var(--midnight);cursor:pointer">Login</button>
<button style="font-family:var(--font-button);font-weight:700;border-radius:50px;padding:20px 30px;font-size:var(--text-button-size);letter-spacing:var(--text-button-ls);border:1px solid var(--orange-crush);background:var(--orange-crush);color:#fff;cursor:pointer">Get Started</button>
<button style="font-family:var(--font-button);font-weight:700;border-radius:0;padding:8px 16px;font-size:var(--text-xs-size);letter-spacing:var(--text-button-ls);border:1px solid transparent;background:transparent;color:var(--midnight);cursor:pointer">Learn more</button>
</body></html>
