<!-- @dsCard group="Components" viewport="700x260" name="Pricing Card" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../../styles.css"></head>
<body style="margin:0;padding:24px;background:var(--clay-light);display:flex;gap:16px">
<div style="font-family:var(--font-body);border:1px solid var(--color-border-default);border-radius:0;padding:20px;min-width:200px;background:#fff;display:flex;flex-direction:column;gap:10px">
  <span style="font-size:12px;font-weight:700;letter-spacing:-1px;color:var(--midnight)">Up to 1,000 employees</span>
  <h3 style="font-family:var(--font-heading);font-size:31px;letter-spacing:-2px;margin:0;color:var(--midnight)">Growth</h3>
  <p style="font-size:16px;line-height:20px;letter-spacing:-1px;color:var(--charcoal);margin:0">Scaled live training + customized agentic workflows</p>
  <hr style="border:none;border-top:1px solid var(--sage-veil);margin:8px 0">
  <strong style="font-family:var(--font-heading);font-size:31px;letter-spacing:-2px;color:var(--midnight)">$20,000</strong>
</div>
<div style="font-family:var(--font-body);border:1px solid var(--orange-crush);border-radius:0;padding:20px;min-width:200px;background:#fff;display:flex;flex-direction:column;gap:10px">
  <span style="font-size:12px;font-weight:700;letter-spacing:-1px;color:var(--midnight)">Up to 5,000 employees</span>
  <h3 style="font-family:var(--font-heading);font-size:31px;letter-spacing:-2px;margin:0;color:var(--midnight)">Enterprise</h3>
  <p style="font-size:16px;line-height:20px;letter-spacing:-1px;color:var(--charcoal);margin:0">Cross-functional training, LMS integration, and observability dashboards</p>
  <hr style="border:none;border-top:1px solid var(--sage-veil);margin:8px 0">
  <strong style="font-family:var(--font-heading);font-size:31px;letter-spacing:-2px;color:var(--midnight)">$35,000</strong>
</div>
</body></html>
