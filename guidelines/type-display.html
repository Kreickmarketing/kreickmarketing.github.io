<!-- @dsCard group="Type" viewport="800x340" name="Type Scale" subtitle="Saira headings/body, real sizes from Figma" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-heading);color:var(--color-text-heading)}
p{margin:0 0 10px}
.h1{font-size:var(--text-h1-size);line-height:var(--text-h1-lh);letter-spacing:var(--text-h1-ls);font-weight:300}
.h2{font-size:var(--text-h2-size);line-height:var(--text-h2-lh);letter-spacing:var(--text-h2-ls);font-weight:300}
.h3{font-size:var(--text-h3-size);line-height:var(--text-h3-lh);letter-spacing:var(--text-h3-ls);font-weight:300}
.tag{font-family:var(--font-body);font-size:var(--text-tagline-size);letter-spacing:var(--text-tagline-ls);font-weight:700;text-transform:uppercase;color:var(--color-text-body)}
</style></head><body>
<p class="h1">Heading 1</p>
<p class="h2">Heading 2</p>
<p class="h3">Heading 3</p>
<p class="tag">Tagline</p>
</body></html>
