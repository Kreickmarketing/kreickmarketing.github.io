<title>Author Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: navy masthead, one centred column for authors; two-pane console for staff. Book-production vocabulary throughout. */
:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --surface-2:#EFE8DC;
  --ink:#16202E; --muted:#5B6474; --line:#DDD3C2;
  --navy:#15264A; --navy-2:#223A68; --on-navy:#F4EEE4; --on-navy-muted:#B9C2D4;
  --tan:#B8925E; --tan-soft:#E9DCC6; --tan-ink:#7A5A2C;
  --ok:#2E7351; --ok-soft:#DCEBE2; --warn:#9A6210; --warn-soft:#F4E5C9; --bad:#A63A32; --bad-soft:#F5DDDA;
  --info:#2F4F8A; --info-soft:#DEE5F2;
  --focus:#3D6BC4;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1524; --surface:#142038; --surface-2:#1A2946;
  --ink:#ECE6DB; --muted:#A3ACBD; --line:#2B3B5C;
  --navy:#0A1222; --navy-2:#1A2B4D; --on-navy:#F1EADF; --on-navy-muted:#9BA6BC;
  --tan:#D2B184; --tan-soft:#3A3326; --tan-ink:#E3C89E;
  --ok:#7CC39C; --ok-soft:#1C3A2C; --warn:#E2B464; --warn-soft:#3D3019; --bad:#EE958C; --bad-soft:#47221F;
  --info:#9DB6E6; --info-soft:#1F3157; --focus:#8FB0F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#142038; --surface-2:#1A2946;
  --ink:#ECE6DB; --muted:#A3ACBD; --line:#2B3B5C;
  --navy:#0A1222; --navy-2:#1A2B4D; --on-navy:#F1EADF; --on-navy-muted:#9BA6BC;
  --tan:#D2B184; --tan-soft:#3A3326; --tan-ink:#E3C89E;
  --ok:#7CC39C; --ok-soft:#1C3A2C; --warn:#E2B464; --warn-soft:#3D3019; --bad:#EE958C; --bad-soft:#47221F;
  --info:#9DB6E6; --info-soft:#1F3157; --focus:#8FB0F0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--tan-ink)}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* masthead */
.mast{background:var(--navy);color:var(--on-navy);border-bottom:3px solid var(--tan)}
.mast-in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.mark svg{flex:none}
.mark b{font-family:var(--serif);font-weight:500;font-size:1.2rem;letter-spacing:.01em}
.mark span{color:var(--on-navy-muted);font-size:.82rem;display:block;line-height:1.2}
.mast .sp{flex:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid transparent;color:var(--on-navy-muted);padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--on-navy);border-color:var(--tan)}
.tabs button:hover{color:var(--on-navy)}

.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:24px 56px}
@media (max-width:520px){.wrap{padding-inline:16px}.mast-in{padding-inline:16px}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--tan)}
.btn.primary{background:var(--navy-2);border-color:var(--navy-2);color:var(--on-navy)}
.btn.primary:hover{background:var(--navy)}
.btn.tan{background:var(--tan);border-color:var(--tan);color:#1B1408}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.notice.err{border-color:var(--bad);background:var(--bad-soft)}
.notice.ok{border-color:var(--ok);background:var(--ok-soft)}
.notice.info{border-color:var(--info);background:var(--info-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(560px,calc(100% - 32px))}

/* ===== author view ===== */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end;padding-block:8px 28px;border-bottom:1px solid var(--line)}
.spine{width:92px;aspect-ratio:2/3;max-width:100%;background:var(--navy-2);border-radius:3px 8px 8px 3px;position:relative;box-shadow:inset 7px 0 0 rgba(0,0,0,.18),0 10px 24px -14px rgba(10,18,34,.6);display:flex;align-items:flex-end;padding:10px 9px}
.spine::before{content:"";position:absolute;left:14px;right:10px;top:16px;height:2px;background:var(--tan)}
.spine::after{content:"";position:absolute;left:14px;right:22px;top:24px;height:1px;background:var(--tan);opacity:.7}
.spine i{font-family:var(--serif);font-style:italic;color:var(--on-navy);font-size:.66rem;line-height:1.15;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hero h1{font-size:clamp(1.9rem,4.4vw,2.9rem);margin-top:6px}
.hero .by{margin-top:8px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap}
.hero .by b{color:var(--ink);font-weight:500}
@media (max-width:520px){.hero{grid-template-columns:1fr;gap:16px}.spine{width:72px}}

.sec{padding-block:28px;border-bottom:1px solid var(--line);display:grid;gap:16px}
.sec:last-child{border-bottom:0}
.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sechead .sp{flex:1}

/* stage tracker */
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:0;counter-reset:st}
.stages li{position:relative;padding-top:30px;padding-right:8px;font-size:.84rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.stages li::before{content:"";position:absolute;top:9px;left:0;right:0;height:3px;background:var(--line)}
.stages li:last-child::before{right:auto;width:14px}
.stages li .dot{position:absolute;top:2px;left:0;width:17px;height:17px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.stages li.done{color:var(--ink)}
.stages li.done::before{background:var(--tan)}
.stages li.done .dot{background:var(--tan);border-color:var(--tan)}
.stages li.cur{color:var(--ink);font-weight:600}
.stages li.cur .dot{border-color:var(--navy-2);background:var(--navy-2);box-shadow:0 0 0 4px var(--tan-soft)}
.stages li.cur::before{background:linear-gradient(90deg,var(--tan) 0 9px,var(--line) 9px)}
.stages li .here{display:block;font-weight:500;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tan-ink);margin-top:2px}
@media (max-width:720px){
  .stages{grid-template-columns:1fr}
  .stages li{padding:0 0 16px 32px}
  .stages li::before{top:0;bottom:0;left:7px;right:auto;width:3px;height:auto}
  .stages li:last-child::before{display:none}
  .stages li .dot{top:2px}
  .stages li.cur::before{background:var(--line)}
}
.stagecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stagecard .big{font-family:var(--serif);font-size:1.5rem}
.stagecard .sp{flex:1}

/* needs */
.needs{display:grid;gap:12px}
.need{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:start}
.need.open{border-left:4px solid var(--tan)}
.need.sub{border-left:4px solid var(--info)}
.need h3{font-size:1.15rem}
.need .meta{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:.86rem;color:var(--muted)}
.need .det{grid-column:1/-1;color:var(--muted);font-size:.92rem;max-width:68ch;white-space:pre-line}
.need .act{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.need .sublink{grid-column:1/-1;font-size:.86rem;overflow-wrap:anywhere}
@media (max-width:520px){.need{grid-template-columns:1fr}.need .act{grid-row:auto;grid-column:1;align-items:flex-start}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.chip.needed{background:var(--tan-soft);color:var(--tan-ink)}
.chip.submitted{background:var(--info-soft);color:var(--info)}
.chip.received{background:var(--ok-soft);color:var(--ok)}
.chip.overdue{background:var(--bad-soft);color:var(--bad)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
details.done{border:1px dashed var(--line);border-radius:var(--r);padding:10px 16px}
details.done summary{cursor:pointer;color:var(--muted);font-weight:500}
details.done ul{margin:10px 0 2px;padding:0;list-style:none;display:grid;gap:6px}
details.done li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted)}

/* two-col lower */
.lower{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;padding-block:28px}
@media (max-width:820px){.lower{grid-template-columns:1fr}}
.dates{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.dates li{display:grid;grid-template-columns:5.2rem 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cal{border:1px solid var(--line);border-radius:6px;text-align:center;overflow:hidden;background:var(--surface);width:4.2rem}
.cal small{display:block;background:var(--navy-2);color:var(--on-navy);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;padding:2px 0}
.cal b{display:block;font-family:var(--serif);font-size:1.35rem;font-weight:500;line-height:1.5}
.dates .lbl{min-width:0}
.dates .lbl span{display:block;font-size:.82rem;color:var(--muted)}
.contact{background:var(--navy);color:var(--on-navy);border-radius:var(--r);padding:22px;display:grid;gap:14px;align-content:start}
.contact .eyebrow{color:var(--tan)}
.contact .who{display:flex;gap:14px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--tan);color:#1B1408;display:grid;place-items:center;font-family:var(--serif);font-size:1.25rem;flex:none}
.contact .nm{font-family:var(--serif);font-size:1.35rem;line-height:1.2}
.contact .rl{color:var(--on-navy-muted);font-size:.9rem}
.contact dl{margin:0;display:grid;gap:10px}
.contact dt{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-navy-muted)}
.contact dd{margin:2px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere;user-select:all}
.contact .btn{background:transparent;color:var(--on-navy);border-color:rgba(255,255,255,.28);user-select:none}
.contact .btn:hover{border-color:var(--tan)}
.foot{color:var(--muted);font-size:.82rem;padding-top:8px}

/* overlay dialog */
.ov{position:fixed;inset:0;background:rgba(8,14,28,.55);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{background:var(--surface);color:var(--ink);border-radius:14px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;display:grid;gap:16px;border-top:4px solid var(--tan)}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy-2);color:var(--on-navy)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;display:grid;gap:4px}
.drop.over{border-color:var(--tan);background:var(--tan-soft)}
label.f{display:grid;gap:5px;font-size:.88rem;font-weight:500;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=url],input[type=email],input[type=tel],input[type=search],input[type=date],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}

/* ===== staff console ===== */
.banner{background:var(--tan-soft);color:var(--tan-ink);border-bottom:1px solid var(--line)}
.banner .wrap{padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.console{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.console{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel>header .sp{flex:1}
.panel .body{padding:16px;display:grid;gap:14px}
.alist{list-style:none;margin:0;padding:6px;display:grid;gap:2px;max-height:70vh;overflow:auto}
.alist button{width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:10px;cursor:pointer;display:grid;gap:2px}
.alist button:hover{background:var(--surface-2)}
.alist button[aria-current="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--tan)}
.alist .t{font-family:var(--serif);font-size:1.02rem}
.alist .s{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.steps{display:grid;gap:18px}
.step{display:grid;gap:12px}
.step>h3{display:flex;gap:10px;align-items:baseline}
.step>h3 .n{font-family:var(--sans);font-size:.75rem;font-weight:600;color:var(--tan-ink);border:1px solid var(--tan);border-radius:999px;padding:1px 8px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th{text-align:left;font-weight:600;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td input,.tbl td select{min-width:110px}
.picklist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;display:grid;gap:2px}
.picklist label{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:.9rem}
.picklist label:hover{background:var(--surface-2)}
.picklist .why{color:var(--muted);font-size:.78rem}
.prevframe{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:0 18px;max-height:none}
.prevtag{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.rowx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}
.copybox{display:flex;gap:8px;align-items:center;min-width:0}
.copybox code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--surface-2);padding:6px 8px;border-radius:6px;font-size:.82rem;user-select:all}
.gate{max-width:560px;margin:48px auto;text-align:center;display:grid;gap:14px;justify-items:center}
.gate h1{font-size:2rem}
</style>

<style>
.files{list-style:none;margin:0;padding:0;grid-column:1/-1;display:grid;gap:4px;font-size:.86rem}
.files li{display:flex;gap:8px;align-items:center;min-width:0}
.files a{overflow-wrap:anywhere}
.people{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.people li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex-wrap:wrap}
.people img{width:28px;height:28px;border-radius:50%;flex:none}
.people .who{flex:1;min-width:0;overflow-wrap:anywhere}
.linked{display:flex;gap:10px;align-items:center;background:var(--ok-soft);border:1px solid var(--ok);border-radius:8px;padding:10px 12px;flex-wrap:wrap}
.linked img{width:32px;height:32px;border-radius:50%}
</style>
<style>
/* ===== staff builder: preview · content cards · sources ===== */
.bwrap{padding-inline:16px;padding-block:0 40px}
.btop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.btop .book{min-width:0;flex:1 1 260px}
.btop .book h1{font-size:1.25rem}
.btop .book .sub{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.score{display:flex;align-items:center;gap:10px}
.cap{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score .n{font-family:var(--serif);font-size:1.4rem;font-variant-numeric:tabular-nums}
.score .bar{width:120px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--tan);width:0;transition:width .3s}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;background:var(--surface);font-size:.85rem}
.acct img{width:22px;height:22px;border-radius:50%}
.acct .dotw{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.bnotice{margin-top:10px}
.bgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.8fr);gap:16px;margin-top:14px;align-items:start}
@media (max-width:1180px){.bgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.bgrid .srccol{grid-column:1/-1}}
@media (max-width:760px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.bcol{min-width:0;display:flex;flex-direction:column;gap:10px}
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.phead h2{font-family:var(--sans);font-size:.95rem;font-weight:600}
.phead .sp{flex:1}
.pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);min-height:42px;font-size:.85rem}
.pvbar .pvname{font-weight:600}
.pvwrap{position:relative;overflow:hidden;margin:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.pvpage{position:absolute;left:0;top:0;width:1040px;transform-origin:0 0;padding:0 28px;background:var(--bg)}
.pvpage .hero{padding-top:24px}
.pvpage .ph{border:2px dashed var(--tan);border-radius:8px;background:color-mix(in srgb,var(--tan-soft) 55%,transparent);color:var(--tan-ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font:500 .9rem/1.3 var(--sans);letter-spacing:0;text-transform:none}
.pvpage .ph.in{display:inline-flex;padding:2px 8px;min-height:0;font-size:.78rem;vertical-align:middle}

<script>
/* ============================================================

  {id:'needs',grp:'What we need',label:'Items the author owes',kind:'list',count:10,fields:['item','detail','due','status'],need:'What the author still has to send: manuscript, cover files, QR codes, revisions. Item name, one line telling them what to send, due date as YYYY-MM-DD, and status (Needed, Submitted or Received).',best:'monday: book board tasks and Project Revisions items waiting on the author'},
  {id:'dates',grp:'Deadlines',label:'Upcoming deadlines',kind:'list',count:10,fields:['label','date'],need:'Dates the author should know about (proofs to you, files due, on-sale). Date as YYYY-MM-DD.',best:'monday: date columns on the book board and Printing board'},

  {id:'folder',grp:'Uploads',label:'Upload folder',kind:'folder',need:'A Google Drive folder shared with the author. Files they send from their page land here.',best:'Drive: drop the book’s author-upload folder here, or create one'},

const SLOT=Object.fromEntries(SLOTS.map(s=>[s.id,s]));
const FMAX={stages:{stage:50},needs:{item:60,detail:200,due:10,status:10},dates:{label:60,date:10},contact:{name:50,role:50,email:80,phone:30}};
const fmax=(s,f)=>((FMAX[s.id]||{})[f])||60;

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);else if(k in e&&typeof v!=='string')e[k]=v;else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}

const isoDay=s=>{const m=/(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(m)return`${m[1]}-${m[2]}-${m[3]}`;const d=s&&!/^\d+$/.test(s)?new Date(s):null;return d&&!isNaN(d)&&/\d{4}/.test(s)?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:''};
const dateObj=s=>{const d=isoDay(s);if(!d)return null;const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd)};
const fmtLong=s=>{const d=dateObj(s);return d?d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):(s||'')};
function daysUntil(s){const d=dateObj(s);if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function whenText(n){if(n==null)return'';if(n===0)return'Today';if(n===1)return'Tomorrow';if(n===-1)return'1 day overdue';if(n<0)return`${-n} days overdue`;if(n<14)return`In ${n} days`;return n<60?`In ${Math.round(n/7)} weeks`:`In ${Math.round(n/30)} months`}
function ago(iso){if(!iso)return'never';const s=(Date.now()-new Date(iso))/1000;if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago'}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
function toast(msg,kind){const t=$('toast');t.replaceChildren();if(!msg)return;t.append(el('div',{class:'notice '+(kind||'info'),role:'status'},el('div',{text:msg}),el('button',{class:'btn sm ghost',type:'button',text:'Dismiss',onclick:()=>t.replaceChildren()})));clearTimeout(toast._t);if(kind!=='err')toast._t=setTimeout(()=>t.replaceChildren(),7000)}

const spinner=()=>el('span',{class:'spin','aria-hidden':'true'});

const folderUrl=id=>`https://drive.google.com/drive/folders/${id}`;
function driveIdFrom(s){s=cv(s);let m=/\/folders\/([\w-]{10,})/.exec(s)||/\/d\/([\w-]{10,})/.exec(s)||/[?&]id=([\w-]{10,})/.exec(s);if(m)return{id:m[1],folder:/\/folders\//.test(s)};if(/^[\w-]{20,}$/.test(s.trim()))return{id:s.trim(),folder:null};return null}
function overlay(dlg){const ov=el('div',{class:'ov',onclick:e=>{if(e.target===ov)closeOv()}},dlg);ov.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv()});$('ovhost').replaceChildren(ov)}

const normStatus=s=>{const n=norm(s);if(/submit|review|sent/.test(n))return ST.submitted;if(/receiv|approv|done|complete/.test(n))return ST.received;return ST.needed};
const statusKind=s=>{const n=norm(s);if(/submit|review/.test(n))return'submitted';if(/receiv|approv|done|complete|closed/.test(n))return'received';return'needed'};

/* ---------- platform ---------- */
let MCP=null,DB=null,USER=null,ROOM=null,SAMPLE=null,FILEARGS=false,GD_READY=false,MY_ID=null;
function mcpMsg(e,server){const c=e&&e.code;server=(e&&e.server)||server||'The connector';
  if(c==='needs_reauth')return`Reconnect ${server} in claude.ai Settings → Connectors, then try again.`;
  if(c==='server_not_connected'||c==='server_not_found')return`Connect ${server} in claude.ai Settings → Connectors, then reload this page.`;
  if(c==='selection_required')return`Choose which ${server} account this page should use, then try again.`;
  if(c==='not_in_manifest')return`${server} access is turned off for this page.`;
  if(c==='blocked_by_policy'||c==='approval_required')return`Your organization’s settings block this ${server} request.`;
  if(c==='denied'||c==='not_granted')return`This page needs your permission to use ${server}. Allow it from the page’s Permissions menu, then try again.`;
  if(c==='server_unavailable')return`${server} didn’t answer. Try again in a moment.`;
  if(c==='tool_error')return`${server}: ${e.message||'the request failed.'}`;
  return`${server}: ${(e&&e.message)||'something went wrong.'}`}
async function call(server,tool,input,opts){
  if(!MCP)throw{code:'unavailable',server,message:'Connectors aren’t available in this view.'};
  let r;try{r=await MCP.callTool(server,tool,input,opts)}catch(e){
    if(e&&e.retryable){await new Promise(z=>setTimeout(z,(e.retryAfterMs||1200)+Math.random()*600));r=await MCP.callTool(server,tool,input,opts)}else throw e}
  let p=r&&r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(_){}}
  return p}
async function listFolder(id,withFolders){let files=[],tok=null,guard=0;
  do{const inp={query:`parentId = '${String(id).replace(/'/g,"\\'")}'`,excludeContentSnippets:true,pageSize:100};if(tok)inp.pageToken=tok;
    const r=await call(GD,'search_files',inp,{cache:false});files=files.concat((r&&r.files)||[]);tok=r&&(r.nextPageToken||r.next_page_token)}while(tok&&++guard<5);
  if(!withFolders)files=files.filter(f=>!String(f.mimeType||'').includes('folder'));
  return files.sort((a,b)=>{const fa=(a.mimeType||'').includes('folder'),fb=(b.mimeType||'').includes('folder');return fa!==fb?(fa?-1:1):String(a.title).localeCompare(String(b.title))})}
const fileUrl=f=>f.viewUrl||f.webViewLink||(f.id?`https://drive.google.com/file/d/${f.id}/view`:'');
const fileTime=f=>f.createdTime||f.modifiedTime||'';
function filesFor(label,files){const k=norm(label);return(files||[]).filter(f=>{const t=norm(f.title||f.name);return k&&(t===k||t.startsWith(k+' '))})}

/* ============================================================
   THE DASHBOARD (one renderer for the author's page and the staff preview)
   staff:true → every block carries data-slot, and empty blocks show a
   dashed placeholder you can drop a source onto.
   ============================================================ */
function renderDashboard(host,m,opt={}){
  host.replaceChildren();
  const staff=!!opt.staff,live=!!opt.interactive,files=opt.files||null;
  const ph=(id,label,style)=>el('div',{class:'ph','data-slot':id,style:style||'min-height:60px',text:label||SLOT[id].label});

  const tag=(node,id)=>{if(staff&&node)node.setAttribute('data-slot',id);return node};
  const b=m.book||{};
  if(live&&b.publisher){$('brand').textContent=b.publisher;$('brandsub').textContent='Author Portal'}
  // hero
  const art=b.cover?tag(el('img',{class:'cover',src:b.cover,alt:`Cover of ${b.title||'your book'}`}),'cover')
    :staff?ph('cover','Cover image','width:110px;height:165px'):el('div',{class:'spine','aria-hidden':'true'},el('i',{text:b.title||'Your book'}));

    el('div',{style:'min-width:0'},
      el('div',{class:'eyebrow'},b.publisher?tag(el('span',{text:b.publisher}),'publisher'):staff?phIn('publisher','Imprint'):null,b.publisher||staff?' · Your book':'Your book'),
      b.title?tag(el('h1',{text:b.title}),'title'):staff?ph('title','Book title','min-height:54px;margin-top:6px'):el('h1',{text:'Your book'}),
      el('div',{class:'by'},b.author?el('span',{},'By ',tag(el('b',{text:b.author}),'author')):staff?phIn('author','Author name'):null,
        b.onSale?el('span',{},'On sale ',tag(el('b',{class:'num',text:fmtLong(b.onSale)}),'onsale')):staff?phIn('onsale','On-sale date'):null))));

  if(stages.length){const ol=el('ol',{class:'stages',style:`--n:${stages.length}`});

    el('span',{class:'sp'}),st.note?tag(el('p',{class:'muted',style:'max-width:52ch',text:st.note}),'note'):staff?ph('note','Stage note: what happens next','min-height:40px;flex:1;min-width:200px'):null));

  const open=needs.filter(n=>statusKind(n.status)!=='received').sort((a,c)=>(a.due||'9999').localeCompare(c.due||'9999'));
