<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ClearMark CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@200;300;400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: icon rail + context panel (from ClearMark Studio) beside a clean white workspace (tables, kanban, record panel).
   Single light theme on purpose: ClearMark's white site palette. */
:root{
  color-scheme:light;
  --white:#FFFFFF; --clay-light:#F6F7F8; --clay:#DFE1E5; --midnight:#1C2026; --charcoal:#2C3139; --iron:#444D4D; --taupe:#7D8088; --sage:#B4B7BD;
  --cherry:#DB1F3D; --azure:#0099CE; --flare:#F5DE73; --brass:#C8A74B; --tangerine:#E48F46; --moss:#336A4E; --mint:#ABCFA1; --cobalt:#294079; --aegean:#2D6AA5; --lavender:#C6B7E1; --teal:#01717D; --emerald:#469C6F;
  --bg:var(--white); --side:var(--clay-light); --line:#EBECEF; --line-2:var(--clay); --ink:var(--midnight); --ink-2:var(--iron); --ink-3:var(--taupe);
  --hover:#F2F3F5; --sel:color-mix(in srgb,var(--azure) 10%,#fff);
  --f:"Saira","Segoe UI",system-ui,sans-serif; --mono:"Courier Prime","Courier New",ui-monospace,monospace;
  --rail:64px; --panel:248px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
:focus-visible{outline:2px solid var(--azure);outline-offset:2px}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
@property --pw{syntax:'<length>';inherits:true;initial-value:248px}
.app{--pw:var(--panel);display:grid;grid-template-columns:var(--rail) var(--pw) minmax(0,1fr);height:100%;position:relative;transition:--pw .22s ease}
.app.collapsed{--pw:0px}
.panel{overflow-x:hidden}
.app.collapsed .panel{visibility:hidden;transition:visibility 0s .22s}
/* the border between the side panel and the page: hover it to show the collapse / expand control */
.edge{position:absolute;top:0;bottom:0;left:calc(var(--rail) + var(--pw) - 7px);width:14px;z-index:40;cursor:col-resize;touch-action:none;user-select:none;-webkit-user-select:none}
.edge::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:transparent;transition:background .15s}
.edge:hover::before,.app.resizing .edge::before{background:var(--azure)}
/* rollover indicator: two-way arrow + Collapse / Expand, follows the pointer down the border */
.edge-tip{position:absolute;left:14px;top:var(--ty,76px);transform:translateY(-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 11px 4px 8px;font:600 11.5px/1 var(--f);color:var(--ink-2);box-shadow:0 4px 14px -6px rgba(28,32,38,.25);opacity:0;pointer-events:none;transition:opacity .15s}
.edge-tip svg{width:16px;height:16px;color:var(--azure)}
.edge-tip small{font:400 11px var(--mono);color:var(--ink-3)}
.edge:hover .edge-tip,.edge-tip:focus-visible{opacity:1}
.app.resizing{transition:none;user-select:none}
.app.resizing,.app.resizing *{cursor:col-resize!important}
.app.resizing .edge-tip{opacity:0}
/* scrollbars: thin rounded light-grey thumb on a clear track (Studio style, white) */
*{scrollbar-width:thin;scrollbar-color:#D3D6DB transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D3D6DB;border-radius:999px;border:3px solid transparent;background-clip:padding-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:#B4B7BD;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

/* rail */
.rail{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 0}
.logo{width:40px;height:40px;border-radius:10px;background:var(--cherry);color:#fff;display:grid;place-items:center;font:700 16px/1 var(--f);letter-spacing:-.5px;margin-bottom:12px}
.rbtn{width:56px;border:0;background:none;border-radius:10px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:600;position:relative}
.rbtn svg{width:20px;height:20px;padding:5px;box-sizing:content-box;border-radius:8px}
.rbtn:hover{color:var(--ink)}.rbtn:hover svg{background:var(--white)}
.rbtn[aria-current="true"]{color:var(--ink)}.rbtn[aria-current="true"] svg{background:var(--white);color:var(--azure);box-shadow:0 0 0 1px var(--line-2)}
.rbtn .dot{position:absolute;top:4px;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--cherry);color:#fff;font:700 10px/16px var(--mono);padding:0 4px}
.rsp{flex:1}

/* context panel */
.panel{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto;min-width:0}
/* side panel: accordion sections (Studio layers style, in white) */
.acc{border-top:1px solid var(--line)}
.acch{display:flex;align-items:center;gap:2px;padding:8px 10px 6px 4px}
.grip{cursor:grab;color:var(--sage);font:700 11px var(--mono);letter-spacing:-3px;padding:2px 7px 2px 5px;user-select:none;border-radius:4px}
.grip:hover{color:var(--ink-2);background:var(--hover)}
.acct{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:none;padding:4px 2px;font:700 11px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:left}
.acct:hover{color:var(--ink)}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chv{width:12px;height:12px;transition:transform .15s;flex:none}
[aria-expanded="true"]>.chv{transform:rotate(90deg)}
.pbtn{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:2px 10px;font:600 11.5px var(--f);color:var(--ink-2);white-space:nowrap}
.pbtn:hover{border-color:var(--sage);color:var(--ink)}
.accb{padding:0 8px 10px;display:grid;gap:1px}
.acc.closed .accb{display:none}
.acc.d-before{box-shadow:inset 0 2px 0 var(--azure)}.acc.d-after{box-shadow:inset 0 -2px 0 var(--azure)}
.acc.moving,.node.moving{opacity:.4}
.node{display:flex;align-items:center;border-radius:8px}
.node>.prow{flex:1;min-width:0}
.tw{width:20px;height:28px;border:0;background:none;color:var(--ink-3);display:grid;place-items:center;padding:0;flex:none}
.tw:hover{color:var(--ink)}
.tw.none{visibility:hidden}
.node.d-before{box-shadow:inset 0 2px 0 var(--azure)}.node.d-after{box-shadow:inset 0 -2px 0 var(--azure)}
.node.dropin{background:var(--sel);box-shadow:inset 0 0 0 1.5px var(--azure)}
.sub{padding-left:20px;display:grid;gap:1px}
.prow.s{min-height:30px;padding:5px 8px;font-size:13px;color:var(--ink-2)}
.ty{font:11px var(--mono);color:var(--ink-3);white-space:nowrap}
.sdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.pi{width:15px;height:15px;color:var(--ink-3);flex:none}
.thumb{width:34px;height:24px;border-radius:4px;object-fit:cover;flex:none;border:1px solid var(--line)}
.two{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}.two small{font:11px var(--mono);color:var(--ink-3)}
.srow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:grab;font-size:13px;min-width:0;border:0;background:none;width:100%;text-align:left}
.srow:hover{background:var(--hover)}
.srow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .k{font:700 10px var(--mono);color:var(--ink-3);min-width:28px;flex:none}
.srow.upl{cursor:pointer;border:1.5px dashed var(--line-2);justify-content:center;color:var(--ink-3)}
.rf{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;color:var(--ink-3);margin-left:2px;flex:none}
.rf svg{width:13px;height:13px}
.rf:hover{color:var(--azure);background:var(--sel)}
.rf.busy svg{animation:sp .8s linear infinite;color:var(--azure)}
.srcmeta{font:11px var(--mono);color:var(--ink-3);padding:2px 8px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr[draggable="true"]{cursor:grab}
.ws{display:flex;align-items:center;gap:8px;padding:16px 16px 12px;font-weight:600;font-size:15px}
.ptop{padding:0 8px 8px;display:grid;gap:1px}
.ws small{font:400 12px var(--f);color:var(--ink-3)}
.psec{padding:8px;display:flex;flex-direction:column;gap:1px}
.plabel{font:700 11px/1 var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 6px;display:flex;justify-content:space-between}
.prow{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:8px;padding:7px 8px;text-align:left;width:100%;min-height:34px;font-size:13.5px;color:var(--ink)}
.prow:hover{background:var(--hover)}
.prow[aria-current="true"]{background:var(--sel);box-shadow:inset 2px 0 0 var(--azure)}
.prow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ct{font:12px var(--mono);color:var(--ink-3)}
.gico{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font:700 11px var(--f);color:#fff;flex:none}
.pfoot{margin-top:auto;padding:8px;border-top:1px solid var(--line)}

/* main */
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);min-height:62px;flex-wrap:wrap}
.mhead h1{font-size:22px;font-weight:600;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.mhead .sp{flex:1}
.faces{display:flex}.faces .av{margin-left:-6px;box-shadow:0 0 0 2px #fff}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--sage)}
.btn.dark{background:var(--midnight);border-color:var(--midnight);color:#fff}
.btn.dark:hover{background:var(--charcoal)}
.btn.blue{background:var(--azure);border-color:var(--azure);color:#fff;font-weight:600}
.btn.sm{padding:4px 10px;font-size:12px}
.btn svg{width:15px;height:15px}
.ibtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);background:#fff;display:inline-grid;place-items:center}
.ibtn svg{width:15px;height:15px}
.ibtn:hover{border-color:var(--sage)}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:12px 10px;display:flex;align-items:center;gap:7px;color:var(--ink-3);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab svg{width:15px;height:15px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:hover{color:var(--ink)}
.bar{display:flex;align-items:center;gap:8px;padding:14px 24px;flex-wrap:wrap}
.bar .sp{flex:1}
.hidden-ct{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:4px 12px;font:13px var(--mono)}
.scroll{flex:1;overflow:auto;min-height:0}
.proto{font:11px var(--mono);color:var(--ink-3);border:1px dashed var(--line-2);border-radius:999px;padding:2px 10px}

/* table */
.tbl{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13.5px}
.tbl th{position:sticky;top:0;background:#fff;z-index:2;text-align:left;font-weight:500;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
.tbl td{padding:0 12px;height:42px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.tbl th:first-child,.tbl td:first-child{padding-left:24px;position:sticky;left:0;background:#fff;z-index:1}
.tbl th:first-child{z-index:3}
.tbl tr:hover td{background:var(--hover)}
.tbl tr.on td{background:var(--sel)}
.tbl tr{cursor:pointer}
.cellname{display:flex;align-items:center;gap:8px;font-weight:600}
.meta{display:inline-flex;align-items:center;gap:3px;color:var(--ink-3);font:12px var(--mono);font-weight:400;margin-left:4px}
.co{display:inline-flex;align-items:center;gap:7px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.tile{width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;color:#fff;font:700 10px var(--f);flex:none}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:600 10px var(--f);flex:none}
.av.lg{width:48px;height:48px;font-size:17px}
.st{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;line-height:1.5}
.deal{display:inline-flex;align-items:center;gap:6px}
.deal svg{width:14px;height:14px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--clay-light);border:1px solid var(--line);padding:2px 9px 2px 3px;font-size:12.5px}
.tag{font:11px var(--mono);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;color:var(--ink-2);text-transform:uppercase}

/* record panel */
.rec{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-18px 0 40px -24px rgba(28,32,38,.35);display:flex;flex-direction:column;z-index:20}
.rec-top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.rec-top .sp{flex:1}
.rec-hd{padding:18px 20px 8px;display:grid;gap:10px}
.rec-hd .who{display:flex;gap:12px;align-items:center}
.rec-hd h2{font-size:20px}
.recap{margin:4px 20px 0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--clay-light);font-size:13px;display:grid;gap:6px}
.recap b{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--azure)}
.recap ul{margin:0;padding-left:18px}
.rtabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);margin-top:12px}
.rtabs button{border:0;background:none;padding:9px 8px;color:var(--ink-3);border-bottom:2px solid transparent;font-weight:500;font-size:13px}
.rtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.rbody{flex:1;overflow:auto;padding:16px 20px 24px;display:grid;gap:14px;align-content:start}
.fld{display:grid;gap:3px}
.fld label{font:700 11px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fld .v{font-size:14px;overflow-wrap:anywhere}
.ix{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.ix .ic{width:28px;height:28px;border-radius:50%;background:var(--clay-light);display:grid;place-items:center}
.ix .ic svg{width:14px;height:14px}
.ix small{color:var(--ink-3);font:12px var(--mono)}
.note-in{border:1px solid var(--line-2);border-radius:10px;padding:10px;display:grid;gap:8px}
.note-in textarea{border:0;resize:vertical;min-height:60px;outline:none}
.noteitem{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px;font-size:13.5px}
.noteitem>div{white-space:pre-line}

/* kanban */
.kan{display:flex;gap:16px;padding:4px 24px 24px;align-items:flex-start;min-height:100%}
.col{width:290px;flex:none;display:flex;flex-direction:column;gap:10px;border-radius:12px;padding:4px;transition:background .15s}
.col.over{background:var(--sel)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 4px 6px}
.colh .sum{font:600 13px var(--f);color:var(--ink-2)}
.colh .sp{flex:1}
.card{background:#fff;border:1px solid var(--line-2);border-radius:10px;cursor:grab;user-select:none}
.card:hover{border-color:var(--sage)}
.card.drag{opacity:.4}
.card .ct{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);font-weight:600}
.card .cb{padding:10px 12px;display:grid;gap:8px;font-size:13px}
.card .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2)}
.card .row svg{width:14px;height:14px;color:var(--ink-3);flex:none}
.card .amt{font:700 13px var(--mono);color:var(--ink)}

/* messages */
.msg{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
.mlist{border-right:1px solid var(--line);overflow:auto}
.mitem{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.mitem:hover{background:var(--hover)}.mitem.on{background:var(--clay-light)}
.mitem .t{min-width:0}.mitem .t b{display:block;font-weight:600}.mitem .t span{display:block;color:var(--ink-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compose{overflow:auto;background:var(--clay-light);padding:28px}
.mail{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--line-2);border-radius:12px}
.mail .mr{display:flex;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.mail .mr>span:first-child{color:var(--ink-3);width:48px}
.mail .body{padding:18px;min-height:220px;font-size:14px;line-height:1.6;white-space:pre-wrap;outline:none}
.merge{background:color-mix(in srgb,var(--azure) 14%,#fff);color:var(--cobalt);border-radius:4px;padding:0 4px;font:12.5px var(--mono)}
.tools{display:flex;gap:6px;padding:10px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.wait{display:flex;flex-direction:column;align-items:center;gap:4px;margin:10px auto;color:var(--ink-3)}
.wait .pill{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:4px 14px;color:var(--ink);font-weight:500}

/* dashboards */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;padding:8px 24px 32px}
.dcard{border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;align-content:start}
.dcard h3{font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;padding:8px 24px 0}
.kpi{border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:4px}
.kpi small{font:700 11px var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kpi b{font-size:30px;font-weight:300;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.kpi span{font:12px var(--mono);color:var(--ink-3)}
.legend{display:grid;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .n{margin-left:auto;font:13px var(--mono);color:var(--ink-2)}
.donut{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
svg text{font-family:var(--f)}

/* assistants */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:8px 24px 32px}
.acard{border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px;align-content:start}
.acard .h{display:flex;align-items:center;gap:10px}
.acard .h b{flex:1;font-size:15px;font-weight:600}
.aico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.aico svg{width:18px;height:18px}
.tog{width:38px;height:22px;border-radius:11px;background:var(--clay);border:0;position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}

    a.addEventListener('dragleave',e=>{if(!a.contains(e.relatedTarget))a.classList.remove('d-before','d-after')});
    a.addEventListener('drop',e=>{if(!e.dataTransfer.types.includes('application/x-sec'))return;e.preventDefault();const id=e.dataTransfer.getData('application/x-sec');const target=a.dataset.secid;const after=a.classList.contains('d-after');
      if(id&&id!==target){const ids=orderedSections().map(x=>x.id).filter(x=>x!==id);let i=ids.indexOf(target);if(after)i++;ids.splice(i,0,id);UI.ord[S.sec]=ids;saveUI()}renderPanel()})});
  // reorder groups; drop people onto a group
  p.querySelectorAll('[data-grp]').forEach(n=>{

    n.addEventListener('dragend',()=>p.querySelectorAll('.node').forEach(x=>x.classList.remove('moving','d-before','d-after','dropin')));

      if(t.includes('application/x-person')){e.preventDefault();e.dataTransfer.dropEffect='copy';n.classList.add('dropin');return}
      if(t.includes('application/x-grp')){e.preventDefault();const r=n.getBoundingClientRect();const after=e.clientY>r.top+r.height/2;n.classList.toggle('d-before',!after);n.classList.toggle('d-after',after)}});
    n.addEventListener('dragleave',e=>{if(!n.contains(e.relatedTarget))n.classList.remove('dropin','d-before','d-after')});
    n.addEventListener('drop',e=>{const t=e.dataTransfer.types;e.preventDefault();e.stopPropagation();const g=GROUPS.find(x=>x.id===n.dataset.grp);
      if(t.includes('application/x-person')){const pr=PEOPLE.find(x=>x.id===e.dataTransfer.getData('application/x-person'));n.classList.remove('dropin');if(!pr||!g)return;
        if(pr.groups.includes(g.id)){toast(`${pr.name} is already in ${g.name}.`);return}pr.groups.push(g.id);renderPanel();if(S.sec==='crm')drawBody();
        save('addToGroup',{personId:pr.id,groupId:g.id}).then(r=>{if(r)toast(`Added ${pr.name} to ${g.name}.`);else{pr.groups=pr.groups.filter(x=>x!==g.id);renderPanel();if(S.sec==='crm')drawBody()}});return}
      if(t.includes('application/x-grp')){const id=e.dataTransfer.getData('application/x-grp');const after=n.classList.contains('d-after');if(id&&id!==g.id){const from=GROUPS.findIndex(x=>x.id===id);const [m]=GROUPS.splice(from,1);let i=GROUPS.findIndex(x=>x.id===g.id);if(after)i++;GROUPS.splice(i,0,m);save('orderGroups',{ids:GROUPS.map(x=>x.id)})}renderPanel()}})});
}

const CAT=['#0099CE','#DB1F3D','#469C6F','#F5DE73','#294079','#E48F46'];
function donut(items,total,label){let a=-Math.PI/2;const r=56,cx=75,cy=75;let paths='';const sum=items.reduce((s,x)=>s+x.v,0)||1;
  items.forEach((x,i)=>{const frac=x.v/sum;if(!frac)return;const a2=a+frac*Math.PI*2;const large=frac>.5?1:0;const p1=[cx+r*Math.cos(a),cy+r*Math.sin(a)],p2=[cx+r*Math.cos(a2-0.0001),cy+r*Math.sin(a2-0.0001)];
    paths+=`<path d="M${p1[0]} ${p1[1]} A${r} ${r} 0 ${large} 1 ${p2[0]} ${p2[1]}" stroke="${x.c}" stroke-width="18" fill="none"/>`;a=a2});
  return`<div class="donut"><svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="${esc(label)}"><circle cx="75" cy="75" r="56" stroke="#EBECEF" stroke-width="18" fill="none"/>${paths}<text x="75" y="72" text-anchor="middle" font-size="26" font-weight="300" fill="#1C2026">${esc(total)}</text><text x="75" y="92" text-anchor="middle" font-size="10" fill="#7D8088">${esc(label)}</text></svg>
  <div class="legend">${items.map(x=>`<div><i style="background:${x.c}"></i>${esc(x.k)}<span class="n">${esc(x.lab||x.v)}</span></div>`).join('')}</div></div>`}
function bars(items,fmt){const max=Math.max(...items.map(x=>x.v),1);const W=380,H=170,pad=30,bw=(W-pad*2)/items.length;
  return`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="Bar chart">${[0,.5,1].map(t=>`<line x1="${pad}" x2="${W-pad}" y1="${H-t*(H-20)}" y2="${H-t*(H-20)}" stroke="#EBECEF"/><text x="${pad-6}" y="${H-t*(H-20)+4}" text-anchor="end" font-size="10" fill="#7D8088">${fmt(max*t)}</text>`).join('')}
  ${items.map((x,i)=>{const h=(x.v/max)*(H-20);return`<rect x="${pad+i*bw+bw*.22}" y="${H-h}" width="${bw*.56}" height="${h}" rx="4" fill="${x.c||'#0099CE'}"><title>${esc(x.k)}: ${fmt(x.v)}</title></rect><text x="${pad+i*bw+bw/2}" y="${H+16}" text-anchor="middle" font-size="11" fill="#444D4D">${esc(x.k)}</text>${x.v?`<text x="${pad+i*bw+bw/2}" y="${H-h-6}" text-anchor="middle" font-size="11" fill="#1C2026">${fmt(x.v)}</text>`:''}`}).join('')}</svg>`}
function renderDash(){const open=DEALS.filter(d=>d.stage!=='Retainer');const pipe=open.reduce((a,d)=>a+d.value,0);const won=DEALS.filter(d=>d.stage==='Retainer');
  const byStage=STAGES.map(s=>({k:s,v:DEALS.filter(d=>d.stage===s).reduce((a,d)=>a+d.value,0),c:STAGE_COL[s]==='#DFE1E5'?'#B4B7BD':STAGE_COL[s]}));
  const mk={};PEOPLE.forEach(p=>{mk[p.market]=(mk[p.market]||0)+1});const markets=Object.entries(mk).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({k,v,c:CAT[i%CAT.length]}));
  const months=['2026-07','2026-08','2026-09','2026-10'].map(m=>({k:new Date(m+'-15').toLocaleDateString('en-US',{month:'short'}),v:DEALS.filter(d=>d.created===m).length,c:'#294079'}));
  const st={};PEOPLE.forEach(p=>st[p.status]=(st[p.status]||0)+1);const stItems=Object.entries(st).map(([k,v],i)=>({k,v,c:CAT[i%CAT.length]}));
  $('main').innerHTML=`<div class="mhead"><h1>Pipeline overview</h1>${LIVE?'':'<span class="proto">Prototype · sample data</span>'}<span class="sp"></span><button class="btn dark" id="addchart">${svg('plus')}Add chart</button></div><div class="scroll">
  <div class="kpis"><div class="kpi"><small>Open pipeline</small><b>${money(pipe)}</b><span>${open.length} deals · incl. estimates</span></div><div class="kpi"><small>Monthly retainers</small><b>${money(won.reduce((a,d)=>a+d.value,0))}</b><span>${won.length} active</span></div><div class="kpi"><small>Awaiting reply</small><b>${PEOPLE.filter(p=>p.status==='Awaiting reply').length}</b><span>follow-up assistant on</span></div><div class="kpi"><small>Partners</small><b>${PEOPLE.filter(p=>p.status==='Partner').length}</b><span>Omnitas, Perfect Storm, referrals</span></div></div>
  <div class="dgrid"><div class="dcard"><h3>Deal value by stage</h3>${bars(byStage,v=>v>=1000?'$'+Math.round(v/1000)+'K':'$'+Math.round(v))}</div>

    else AP.cards[bid]={...prev,src,fit:'poor',why:`“${srcLabel(sid)}” doesn’t answer this block. Best source: ${b.good.map(srcLabel).join(' or ')}.`};
    renderPortal()},700)}
function findFits(){const empty=BLOCKS.filter(b=>!(AP.cards[b.id]&&AP.cards[b.id].value!=null));const btn=$('fits');btn.innerHTML='<span class="spin"></span> Looking through sources…';
  setTimeout(()=>{let n=0;for(const b of empty){AP.cards[b.id]={src:[b.good[0]],value:b.val,fit:b.fit||'good',why:b.why};if((b.fit||'good')==='good'){AP.cards[b.id].placed=JSON.parse(JSON.stringify(b.val));n++}}
    const st=AP.cards.stages;if(st&&st.placed==null&&st.value){st.placed=JSON.parse(JSON.stringify(st.value));st.fit=st.fit||'good';st.why=st.why||'The book board’s groups, in order.';n++}
    toast(`Drafted ${empty.length} blocks and placed ${n} good fits. Check the partial fits in their cards.`);renderPortal()},1100)}
function apCards(){const box=$('apcards');box.innerHTML=BLOCKS.map(b=>{const c=AP.cards[b.id]||{};const same=c.placed!=null&&JSON.stringify(c.placed)===JSON.stringify(c.value);const st=c.placed!=null?'placed':c.value!=null?'draft':'';const open=AP.open===b.id;
  return`<article class="ccard ${st}" data-card="${b.id}"><button class="ch" data-oc="${b.id}" aria-expanded="${open}"><b>${esc(b.label)}</b>${AP.busy[b.id]?'<span class="spin"></span>':''}<span class="pill ${st==='placed'?'p':st==='draft'?'d':'e'}">${st==='placed'?(same?'Placed':'Edited'):st==='draft'?'Draft':'Empty'}</span></button>
  ${open?`<div class="cb2"><div class="drop">${(c.src||[]).length?'From: '+c.src.map(s=>`<b>${esc(srcLabel(s))}</b>`).join(', '):'Drop a source here or on the preview'}</div>
   ${c.fit?`<div class="verdict ${c.fit}"><b>${c.fit==='good'?'Good fit':c.fit==='partial'?'Partial':'Poor fit'}</b><span>${esc(c.why||'')}</span></div>`:''}
   ${c.value!=null?apEditor(b,c):''}
   <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm dark" data-place="${b.id}" ${c.value==null||same?'disabled':''}>${c.placed!=null&&!same?'Update in preview':'Place in preview'}</button>${c.placed!=null?`<button class="btn sm" data-unplace="${b.id}">Remove from preview</button>`:''}${c.value!=null?`<button class="btn sm" data-clear="${b.id}">Clear</button>`:''}</div></div>`:''}</article>`}).join('');
  box.querySelectorAll('[data-oc]').forEach(x=>x.onclick=()=>{AP.open=AP.open===x.dataset.oc?null:x.dataset.oc;renderPortal()});
  box.querySelectorAll('[data-place]').forEach(x=>x.onclick=()=>{const c=AP.cards[x.dataset.place];c.placed=JSON.parse(JSON.stringify(c.value));renderPortal();setTimeout(()=>{apHl(x.dataset.place,true);setTimeout(()=>apHl(x.dataset.place,false),1200)},50)});
  box.querySelectorAll('[data-unplace]').forEach(x=>x.onclick=()=>{AP.cards[x.dataset.unplace].placed=null;renderPortal()});
  box.querySelectorAll('[data-clear]').forEach(x=>x.onclick=()=>{delete AP.cards[x.dataset.clear];renderPortal()});
  box.querySelectorAll('.ccard').forEach(c=>{c.addEventListener('dragover',e=>{e.preventDefault();c.classList.add('over')});c.addEventListener('dragleave',()=>c.classList.remove('over'));c.addEventListener('drop',e=>{e.preventDefault();c.classList.remove('over');apDrop(c.dataset.card,e.dataTransfer.getData('text/plain'))})});
  box.querySelectorAll('[data-edit]').forEach(i=>i.oninput=()=>{const [bid,path]=i.dataset.edit.split(':');const c=AP.cards[bid];if(path==='v')c.value=i.value;else if(path==='lines')c.value=i.value.split('\n').map(s=>s.trim()).filter(Boolean);else{const[k]=path.split('.');c.value={...c.value,[k]:i.value}}
    const card=i.closest('.ccard');const pl=card.querySelector('.pill');const same=c.placed!=null&&JSON.stringify(c.placed)===JSON.stringify(c.value);pl.textContent=c.placed!=null?(same?'Placed':'Edited'):'Draft';const pb=card.querySelector('[data-place]');pb.disabled=same;pb.textContent=c.placed!=null&&!same?'Update in preview':'Place in preview'});
}
function apEditor(b,c){const v=c.value;
  if(b.id==='cover')return`<img src="${v}" alt="" style="width:70px;border-radius:3px">`;
  if(b.id==='folder')return`<div class="mono" style="font-size:12px">Drive · ${esc(v)}</div><button class="btn sm" style="justify-self:start" onclick="toast('Prototype: would share the folder with the author’s email.')">Share with author</button>`;
  if(b.id==='stages')return`<label class="fld"><label>One stage per line</label><textarea class="in" rows="6" data-edit="stages:lines">${esc(v.join('\n'))}</textarea></label>`;
  if(b.id==='contact')return`<input class="in" data-edit="contact:name.v" value="${esc(v.name)}" placeholder="Name"><input class="in" data-edit="contact:role.v" value="${esc(v.role||'')}" placeholder="Role"><input class="in" data-edit="contact:email.v" value="${esc(v.email||'')}" placeholder="Email">`;
  if(Array.isArray(v))return`<div class="mono muted" style="font-size:12px">${v.length} rows</div>`+v.map(r=>`<div style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px">${esc(Object.values(r).filter(Boolean).join(' · '))}</div>`).join('');
  return b.id==='note'?`<textarea class="in" rows="3" data-edit="${b.id}:v">${esc(v)}</textarea>`:`<input class="in" data-edit="${b.id}:v" value="${esc(v)}">`}

/* ---------- render ---------- */
function render(){renderRail();renderPanel();
  if(S.sec==='crm'){renderCRM();renderRec()}else if(S.sec==='messages')renderMessages();else if(S.sec==='dash')renderDash();else if(S.sec==='assist')renderAssist();else renderPortal()}
/* ---------- collapsible side panel ---------- */
/* side panel: drag the border to resize; dragging past the minimum width snaps it closed */
const PMIN=248,PMAX=460;let PW=PMIN;
try{const w=+localStorage.getItem('cm:pw');if(w>=PMIN&&w<=PMAX)PW=w}catch(_){}
const APPEL=document.querySelector('.app');
function setWidth(w){PW=Math.round(Math.max(PMIN,Math.min(PMAX,w)));APPEL.style.setProperty('--panel',PW+'px')}
function setCollapsed(c,save){APPEL.classList.toggle('collapsed',c);const b=$('edgebtn');const l=c?'Expand':'Collapse';$('edgelbl').textContent=l;b.setAttribute('aria-label',l+' sidebar');b.setAttribute('aria-expanded',String(!c));
  if(save){try{localStorage.setItem('cm:side',c?'0':'1');localStorage.setItem('cm:pw',String(PW))}catch(_){}}}
const isCollapsed=()=>APPEL.classList.contains('collapsed');
{const edge=$('edge');let drag=null;
  edge.addEventListener('pointermove',e=>{if(drag)return;const r=edge.getBoundingClientRect();edge.style.setProperty('--ty',Math.max(16,Math.min(r.height-16,e.clientY-r.top))+'px')});
  edge.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();try{getSelection().removeAllRanges()}catch(_){}drag={x:e.clientX,w:isCollapsed()?0:PW,moved:false,c0:isCollapsed()};edge.setPointerCapture(e.pointerId)});
  edge.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(!drag.moved&&Math.abs(dx)<4)return;
    if(!drag.moved){drag.moved=true;APPEL.classList.add('resizing')}
    const want=drag.w+dx;
    if(want<PMIN-24){if(!isCollapsed())setCollapsed(true,false)}   // past the minimum: snap closed
    else{if(isCollapsed())setCollapsed(false,false);setWidth(want)}});
  const end=e=>{if(!drag)return;const d=drag;drag=null;APPEL.classList.remove('resizing');try{edge.releasePointerCapture(e.pointerId)}catch(_){}
    if(!d.moved)setCollapsed(!isCollapsed(),true);else setCollapsed(isCollapsed(),true)};
  edge.addEventListener('pointerup',end);edge.addEventListener('pointercancel',end);
  $('edgebtn').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setCollapsed(!isCollapsed(),true)}
    if(e.key==='ArrowRight'&&!isCollapsed()){setWidth(PW+16);setCollapsed(false,true)}if(e.key==='ArrowLeft'&&!isCollapsed()){if(PW-16<PMIN)setCollapsed(true,true);else{setWidth(PW-16);setCollapsed(false,true)}}});
}
document.addEventListener('keydown',e=>{if(e.key==='['&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.activeElement.isContentEditable)setCollapsed(!isCollapsed(),true)});
setWidth(PW);
{let st=null;try{st=localStorage.getItem('cm:side')}catch(_){}setCollapsed(st==='0'||(st==null&&innerWidth<=900),false)}
render();
</script>
