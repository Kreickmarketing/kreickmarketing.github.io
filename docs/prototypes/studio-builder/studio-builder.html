<title>ClearMark Studio Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@200;300;400;500;600;700;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: three working panes (page preview · content cards · sources), page thumbnails under the preview.
   Studio chrome is dark (decided Oct 6); the page inside the preview uses ClearMark's own colors. */
:root {
  color-scheme: dark;
  /* Studio chrome */
  --ink: #FFFFFF;
  --ink-2: #B2AFA7;          /* sage-mist */
  --ink-3: #858278;          /* deep-taupe */
  --ground: #1C2026;         /* midnight */
  --panel: #2C3139;          /* charcoal */
  --panel-2: #23282F;
  --line: #444D4D;           /* iron-pine */
  --accent: #0099CE;         /* tidal-azure */
  --accent-soft: color-mix(in srgb, #0099CE 22%, transparent);
  --empty: #9C998F;          /* dusty-sage */
  --draft: #F5DE73;          /* solar-flare */
  --placed: #ABCFA1;         /* frosted-mint */
  --bad: #DC4F58;            /* coral-rush */
  /* ClearMark site (preview) */
  --cm-white: #FFFFFF; --cm-clay-light: #F6F5F2; --cm-clay: #E1DDD5; --cm-midnight: #1C2026;
  --cm-charcoal: #2C3139; --cm-cherry: #DB1F3D; --cm-azure: #0099CE; --cm-iron: #444D4D; --cm-taupe: #858278;
  /* ClearMark color names (styles/colors.css) */
  --white: #FFFFFF; --clay-light: #F6F5F2; --clay: #E1DDD5; --midnight: #1C2026; --rogue-cherry: #DB1F3D; --tidal-azure: #0099CE;
  --sage-mist: #B2AFA7; --deep-taupe: #858278; --iron-pine: #444D4D; --charcoal: #2C3139; --solar-flare: #F5DE73; --honey-brass: #C8A74B;
  --tangerine-burst: #E48F46; --iron-moss: #336A4E; --frosted-mint: #ABCFA1; --cobalt-wave: #294079; --aegean: #2D6AA5; --merlot: #91272B; --lavender-mist: #C6B7E1; --deep-teal: #01717D; --emerald-tide: #469C6F;
  --f-display: "Saira", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Courier Prime", "Courier New", ui-monospace, monospace;
  --f-button: var(--f-display);  /* buttons: Saira (Oct 9, 2026) */
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: 14px/1.45 var(--f-display); padding-inline: 16px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.mono { font-family: var(--f-mono); letter-spacing: 0; }

/* ── Top bar ── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ground); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 16px 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.brand p { margin: 0; color: var(--ink-2); font-size: 13px; }
.save-state { font-size: 12px; color: var(--ink-2); }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 16px; font-family: var(--f-button); font-size: 13px; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--ground); font-weight: 700; }
.btn-small { padding: 3px 10px; font-size: 12px; }
.meter { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 180px; }
.meter b { font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.meter span { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.meter-bar { width: 180px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter-bar i { display: block; height: 100%; background: var(--placed); transition: width 0.3s; }
.note { margin: 12px 0 0; padding: 8px 16px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 13px; }
.note b { color: var(--ink); }

/* ── Panes ── */
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 16px; padding-block: 16px 32px; align-items: start; }
.pane-preview { grid-row: 1 / span 2; }
.pane-cards, .pane-sources { grid-column: 2; }
.pane-cards { grid-row: 1 / span 2; align-self: stretch; }
.edit-float { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 8px; transition: margin-top 0.2s; }
.pane { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; min-height: 32px; }
.pane-head h2 { font-size: 15px; font-weight: 700; }
.hint { color: var(--ink-3); font-size: 12px; }
.seg { display: inline-flex; gap: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 3px 12px; font-family: var(--f-button); font-size: 12px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.switch input { accent-color: var(--accent); }
.tabs-phone { display: none; }

/* Preview */
.status-line { padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--ink-2); font-size: 13px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.status-line b { color: var(--ink); }
.canvas-wrap { position: relative; background: #3a4048; border-radius: 12px; padding: 16px; overflow: hidden; }
.canvas-scale { transform-origin: 0 0; }
.canvas-wrap.phone .canvas-scale { margin-inline: auto; }

/* Page thumbnails */
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 8px; }
.page-thumb { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.page-item { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.page-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding-inline: 2px; }
.page-link, .page-url { font-family: var(--f-mono); font-size: 12px; color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
.page-link:hover, .page-url:hover { text-decoration: underline; }
.live-chip { font-family: var(--f-mono); font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.live-chip.is-live { border-color: var(--placed); color: var(--placed); }
.page-thumb[aria-current="page"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.thumb-box { height: 150px; overflow: hidden; border-radius: 6px; background: var(--cm-clay-light); position: relative; }
.thumb-box > div { position: absolute; top: 0; left: 0; width: 1280px; transform-origin: 0 0; pointer-events: none; }
.page-thumb span { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.page-thumb span b { color: var(--ink); font-weight: 600; }

/* Content cards */
.cards { display: flex; flex-direction: column; gap: 8px; }
.sec-group { display: flex; flex-direction: column; gap: 8px; border-radius: 10px; position: relative; }
.sec-group.drop-before { box-shadow: 0 -4px 0 var(--accent); }
.sec-group.drop-after { box-shadow: 0 4px 0 var(--accent); }
.sec-group.is-moving { opacity: 0.45; }
.sec-head { cursor: grab; user-select: none; touch-action: none; }
.sec-head .grip { color: var(--ink-3); margin-right: 6px; letter-spacing: -1px; }
.sec-head .x { width: 26px; height: 24px; font-size: 12px; padding: 0; }
.sec-head .x:disabled { opacity: 0.3; }
.sec-head-btns { display: inline-flex; gap: 4px; align-items: center; }
.group-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; margin: 8px 0 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ccard { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 10px; }
.ccard.is-draft { border-left-color: var(--draft); }
.ccard.is-placed { border-left-color: var(--placed); }
.ccard.is-selected { border-color: var(--accent); border-left-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ccard.drop-ok { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); border-style: dashed; }
.ccard-head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: none; border: 0; text-align: left; }
.ccard-head .chev { color: var(--ink-3); transition: transform 0.15s; flex: none; }
.ccard[open-card] .chev { transform: rotate(90deg); }
.ccard-title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { flex: none; font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--ink-2); text-transform: uppercase; }
.pill { flex: none; font-family: var(--f-mono); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.pill-empty { color: var(--empty); border: 1px solid var(--line); }
.pill-draft { color: var(--ground); background: var(--draft); }
.pill-placed { color: var(--ground); background: var(--placed); }
.pill-opt { color: var(--ink-3); border: 1px dashed var(--line); }
.ccard-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.ccard-body .about { margin: 0; color: var(--ink-2); font-size: 13px; }
.ccard-body .source { margin: 0; font-size: 12px; color: var(--ink-3); }
.ccard-body .source b { color: var(--ink-2); font-weight: 600; }
.dropzone { border: 1.5px dashed var(--line); border-radius: 8px; padding: 10px; text-align: center; color: var(--ink-3); font-size: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; position: relative; }
.field label { font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
.input { width: 100%; background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 7px 56px 7px 10px; }
textarea.input { resize: vertical; min-height: 72px; line-height: 1.4; }
.count { position: absolute; right: 8px; bottom: 8px; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; pointer-events: none; }
.count.over { color: var(--bad); font-weight: 700; }
.rows { display: flex; flex-direction: column; gap: 16px; }
.row-btns { display: flex; flex-direction: column; gap: 2px; }
.row-btns .x { height: 24px; font-size: 12px; padding: 0; }
.row-btns .x:disabled { opacity: 0.3; }
.row { display: grid; grid-template-columns: 20px minmax(0, 1fr) 28px; gap: 8px 6px; align-items: start; }
/* Each column of a list row gets its own line with a small label above it (Oct 9). */
.row .field + .field { grid-column: 2; }
.row .row-btns { grid-column: 3; grid-row: 1 / span 3; }
.row:has(.field > span) :is(.row-n, .row-btns) { margin-top: 19px; }
.row:has(.field > span) .row-n { padding-top: 7px; }
.row .field > span { font-size: 11px; color: var(--ink-3); }
.row-n { font-family: var(--f-mono); color: var(--draft); font-weight: 700; padding-top: 7px; font-size: 12px; }
.row .input { padding-right: 44px; }
.x { width: 28px; height: 32px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; color: var(--ink-2); }
.x:hover { color: var(--ink); border-color: var(--ink-2); }
.add-row { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px; font-family: var(--f-button); font-size: 12px; }
.card-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.pick-grid figure { margin: 0; position: relative; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; }
.pick-grid img { max-width: 90%; max-height: 90%; object-fit: contain; }
.pick-grid figure.photo img { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; }
.pick-grid .x { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; font-size: 12px; padding: 0; }
.item-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.item-list li { display: flex; align-items: center; gap: 4px; background: var(--ground); border-radius: 6px; padding: 4px 4px 4px 10px; }
.item-list li span { flex: 1; min-width: 0; }
.item-list .x { height: 26px; }
select.input { padding-right: 10px; }

/* Sources */
.sources { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 96px; max-height: calc(100vh - 112px); overflow: auto; }
.src-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
[draggable="true"] { -webkit-user-drag: element; }
.src-img { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--ground); cursor: grab; display: flex; flex-direction: column; }
.src-img .im { aspect-ratio: 4 / 3; display: grid; place-items: center; background: var(--panel-2); }
.src-img .im img { width: 100%; height: 100%; object-fit: cover; }
.src-img.logo .im img { width: auto; height: auto; max-width: 80%; max-height: 60%; object-fit: contain; }
.src-img figcaption { font-size: 11px; color: var(--ink-2); padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-img.is-picked { outline: 2px solid var(--accent); }
.src-text { border: 1px solid var(--line); border-radius: 8px; background: var(--ground); padding: 8px 10px; cursor: grab; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.src-text b { font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }
.src-text span { font-size: 13px; }
.src-text.is-picked { outline: 2px solid var(--accent); }
.src-text .flag { color: var(--draft); font-size: 11px; }
.upload { display: flex; flex-direction: column; gap: 6px; border: 1.5px dashed var(--line); border-radius: 8px; padding: 10px; color: var(--ink-3); font-size: 12px; text-align: center; }
.upload input { font-size: 12px; max-width: 100%; }
.picked-bar { font-size: 12px; color: var(--ink-2); background: var(--accent-soft); border-radius: 6px; padding: 6px 8px; display: flex; justify-content: space-between; gap: 6px; align-items: center; }

/* Templates list */
.tpl-list { display: flex; flex-direction: column; gap: 8px; }
.tpl { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: grab; touch-action: none; user-select: none; }
.tpl:hover { border-color: var(--accent); }
.tpl-thumb { width: 80px; height: 48px; color: var(--ink-2); }
.tpl-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tpl-text span:not(.chip) { color: var(--ink-2); font-size: 12px; }
.tpl-name { font-weight: 400; letter-spacing: 0.06em; color: var(--ink-3); margin-left: 6px; }
.add-section { margin-top: 8px; border: 1.5px dashed var(--line); background: none; border-radius: 10px; padding: 12px; font-family: var(--f-button); font-size: 13px; color: var(--ink-2); }
.add-section:hover { border-color: var(--accent); color: var(--ink); }
.sec-group.is-current > .sec-head { color: var(--ink); }
.x-remove:hover { color: var(--bad) !important; border-color: var(--bad) !important; }
.sec-remove { color: var(--cm-cherry); border-color: var(--cm-cherry); }
/* "Are you sure?" box */
.confirm-backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(10, 12, 15, 0.6); display: grid; place-items: center; padding: 16px; }
.confirm-backdrop[hidden] { display: none; }
.confirm { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.confirm h3 { font-size: 18px; }
.confirm p { margin: 0; color: var(--ink-2); }
.confirm-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 13px; z-index: 50; }

/* ── The ClearMark page inside the preview ── */
.site { width: 1280px; background: var(--cm-clay-light); color: var(--cm-midnight); font-family: var(--f-display); container-type: inline-size; position: relative; }
.site * { box-sizing: border-box; }
.sec { position: relative; }
.guides .sec { outline: 2px dashed rgba(0, 153, 206, 0.55); outline-offset: -8px; }
.sec-tag { display: none; position: absolute; top: 12px; left: 12px; z-index: 5; font-family: var(--f-mono); font-size: 20px; font-weight: 700; background: var(--cm-azure); color: #fff; padding: 2px 10px; border-radius: 999px; }
.sec-tools { display: none; position: absolute; top: 12px; left: 12px; z-index: 6; gap: 8px; align-items: center; }
.guides .sec-tools { display: flex; }
.sec-tools .sec-tag { position: static; }
.guides .sec-tag { display: block; cursor: grab; touch-action: none; user-select: none; }
.sec-flip { font-family: var(--f-button); font-size: 20px; font-weight: 700; background: #fff; color: var(--cm-azure); border: 2px solid var(--cm-azure); border-radius: 999px; padding: 0 12px; }
.split.flip > :first-child { order: 2; }
.split { position: relative; }
.guides [data-item], .guides [data-photoflip] { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
[data-item].is-moving { opacity: 0.4; }
/* Where a dragged card or point will land. */
[data-item].item-before[data-axis="x"] { box-shadow: -10px 0 0 var(--cm-azure); }
[data-item].item-after[data-axis="x"] { box-shadow: 10px 0 0 var(--cm-azure); }
[data-item].item-before[data-axis="y"] { box-shadow: 0 -8px 0 var(--cm-azure); }
[data-item].item-after[data-axis="y"] { box-shadow: 0 8px 0 var(--cm-azure); }
/* Where the photo will go when dropped. */
.split.swap-right::after, .split.swap-left::after { content: "Photo goes here"; position: absolute; top: 0; bottom: 0; width: calc(50% - 24px); display: grid; place-items: center; border: 6px dashed var(--cm-azure); background: rgba(0, 153, 206, 0.12); border-radius: 18px; color: var(--cm-azure); font-family: var(--f-mono); font-size: 28px; font-weight: 700; z-index: 4; }
.split.swap-right::after { right: 0; }
.split.swap-left::after { left: 0; }
.slot.slot-optional { border-style: dotted; opacity: 0.8; }
.drag-ghost { position: fixed; top: 0; left: 0; z-index: 60; pointer-events: none; background: var(--accent); color: #fff; font-family: var(--f-mono); font-weight: 700; font-size: 13px; padding: 4px 12px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
.sec-tag:active { cursor: grabbing; }
/* Where a dragged section will land: a thick blue line above or below. */
.sec.drop-before::before, .sec.drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 12px; background: var(--cm-azure); z-index: 20; }
.sec.drop-before::before { top: -6px; }
.sec.drop-after::after { bottom: -6px; }
.sec.is-moving { opacity: 0.45; }
.sec-off { opacity: 0.35; }
.slot { border: 2px dashed rgba(28, 32, 38, 0.35); border-radius: 10px; background: rgba(225, 221, 213, 0.45); color: var(--cm-taupe); display: grid; place-items: center; text-align: center; padding: 12px; font-size: 15px; cursor: pointer; min-height: 48px; }
.on-dark .slot, .slot.on-dark { border-color: rgba(255, 255, 255, 0.55); background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.8); }
.slot:hover, [data-slot]:hover { outline: 3px solid var(--cm-azure); outline-offset: 2px; }
.slot.is-sel, .filled.is-sel { outline: 3px solid var(--cm-azure); outline-offset: 2px; }
.slot.drop-ok { background: rgba(0, 153, 206, 0.18); border-color: var(--cm-azure); color: var(--cm-azure); }
.filled { cursor: pointer; }
.site-nav { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 32px 64px; color: #fff; }
.site-nav img { height: 40px; }
.site-nav ul { display: flex; gap: 32px; list-style: none; margin: 0; padding: 0; align-items: center; font-size: 17px; }
.site-nav .pill-cta { border: 1.5px solid #fff; border-radius: 999px; padding: 6px 18px; }
.site-nav.nav-bar { position: relative; background: var(--cm-midnight); }
.site-nav .burger { display: none; position: relative; width: 44px; height: 44px; margin-right: -6px; padding: 0; border: 0; background: transparent; cursor: pointer; }
.site-nav .burger span { position: absolute; left: 6px; width: 32px; height: 3px; border-radius: 2px; background: #fff; transition: transform 0.3s ease, opacity 0.2s ease; }
.site-nav .burger span:nth-child(1) { top: 11px; } .site-nav .burger span:nth-child(2) { top: 20px; } .site-nav .burger span:nth-child(3) { top: 29px; }
.site-nav.is-open .burger span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
.site-nav.is-open .burger span:nth-child(2) { opacity: 0; }
.site-nav.is-open .burger span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }
.site-nav .nav-menu { display: none; position: absolute; top: 100%; left: 0; right: 0; overflow: hidden; background: var(--cm-midnight); max-height: 0; visibility: hidden; transition: max-height 0.35s ease, visibility 0.35s; }
.site-nav.is-open .nav-menu { max-height: 480px; visibility: visible; }
.nav-menu-inner { display: flex; flex-direction: column; gap: 32px; padding: 0 32px 32px; }
.nav-menu-inner ol { list-style: none; margin: 0; padding: 0; }
.nav-menu-inner li { padding: 12px 0; border-bottom: 1px solid var(--cm-iron); font-size: 24px; line-height: 32px; }
.nav-menu-cta { align-self: flex-start; background: var(--cm-cherry); color: #fff; border-radius: 999px; padding: 14px 28px; font-family: var(--f-button); font-size: 18px; line-height: 24px; font-weight: 700; }
.chrome-note { font-family: var(--f-mono); font-size: 12px; opacity: 0.7; }

.hero { min-height: var(--screen-h, 800px); color: #fff; background: var(--cm-midnight); display: flex; flex-direction: column; justify-content: flex-end; padding: 160px 64px 64px; gap: 32px; overflow: hidden; }
.hero-bg { position: absolute; inset: 0; z-index: 0; }
.hero-bg :is(img, video) { width: 100%; height: 100%; object-fit: cover; }
.hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(28,32,38,0.45), rgba(28,32,38,0.05) 40%, rgba(28,32,38,0.7)); }
.hero-bg .slot { position: absolute; inset: 24px; z-index: 1; min-height: 0; font-size: 18px; place-items: start end; padding: 64px 24px; }
.hero > *:not(.hero-bg):not(.sec-tag) { position: relative; z-index: 2; }
.hero-main { display: flex; flex-direction: column; gap: 32px; max-width: 760px; }
.hero h1 { font-size: 64px; line-height: 68px; letter-spacing: -3px; font-weight: 200; margin: 0; }
.cta { display: inline-flex; align-items: center; gap: 12px; background: #fff; color: var(--cm-midnight); border-radius: 999px; padding: 14px 28px; font-family: var(--f-button); font-size: 18px; font-weight: 700; align-self: flex-start; }
.cta-red { background: var(--cm-cherry); color: #fff; }
.hero-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; }
.glass { background: rgba(255,255,255,0.14); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); border-radius: 18px; padding: 24px; width: 760px; max-width: 100%; display: flex; flex-direction: column; gap: 12px; font-size: 17px; }
.glass b { font-size: 15px; }
.stat-card { background: #fff; color: var(--cm-midnight); border-radius: 18px; padding: 24px; width: 260px; display: flex; flex-direction: column; gap: 6px; }
.stat-card small { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cm-iron); font-weight: 700; }
.stat-card b { font-size: 44px; line-height: 1; letter-spacing: -2px; }
/* Hero stat chart (Oct 9): two numbers drawn as two rising lines, in the testimonial's see-through style. */
.hstat { flex: none; width: 360px; max-width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.14); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.hstat small { font-size: 12px; line-height: 16px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }
.hstat-chart { display: block; width: 100%; height: 120px; overflow: visible; }
.hstat-grid { fill: none; stroke: rgba(255,255,255,0.18); stroke-width: 1; }
.hstat-a, .hstat-b { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; }
.hstat-a { stroke: rgba(255,255,255,0.6); }
.hstat-b { stroke: var(--cm-cherry); }
.hstat-area { fill: var(--cm-cherry); opacity: 0.28; }
.hstat-keys { display: flex; gap: 32px; }
.hstat-key { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.hstat-key b { font-size: 32px; line-height: 32px; letter-spacing: -1px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hstat-key.a b { color: rgba(255,255,255,0.7); }
.hstat-key > span { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 16px; }
.hstat-key > span::before { content: ""; flex: none; width: 14px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.6); }
.hstat-key.b > span::before { background: var(--cm-cherry); }
/* Arrival, like the pills in the reference video: the testimonial rises in, then the chart card,
   then its lines draw while the numbers count up. Plays once when Studio opens. */
@keyframes rise-in { from { opacity: 0; transform: translateY(24px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes line-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes area-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.intro .hero .glass { animation: rise-in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.3s both; }
.intro .hstat { animation: rise-in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 1s both; }
.intro .hstat .hstat-a { animation: line-draw 1.6s cubic-bezier(0.4, 0, 0.2, 1) 1.6s both; }
.intro .hstat .hstat-b { animation: line-draw 1.6s cubic-bezier(0.4, 0, 0.2, 1) 1.75s both; }
.intro .hstat .hstat-area { animation: area-in 1.6s cubic-bezier(0.4, 0, 0.2, 1) 1.75s both; }
.intro .hstat .gfx-bar { animation: bar-grow 1s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.intro .hstat .gfx-arc { animation: ring-draw 1.6s cubic-bezier(0.4, 0, 0.2, 1) both; }
.hstat.hstat-empty { gap: 8px; padding: 12px; }
.hstat-empty .slot { min-height: 40px; padding: 8px; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .intro .hero .glass, .intro .hstat, .intro .hstat :is(.hstat-a, .hstat-b, .hstat-area, .gfx-bar, .gfx-arc) { animation: none; } }
/* Graph colours: only brand colours. red = Rogue Cherry, blue = Tidal Azure, yellow = Solar Flare,
   green = Emerald Tide, white = White. Hero offers blue, red, green, white; Photo + text red, blue, yellow. */
.gc-red { --gc: var(--cm-cherry); } .gc-blue { --gc: var(--cm-azure); } .gc-yellow { --gc: var(--solar-flare); } .gc-green { --gc: var(--emerald-tide); } .gc-white { --gc: var(--cm-white); }
.hstat-a[class*="gc-"], .hstat-b[class*="gc-"] { stroke: var(--gc); }
.hstat-area[class*="gc-"] { fill: var(--gc); }
.hstat-key[class*="gc-"] > span::before { background: var(--gc); }
/* Photo + text graph overlay (Oct 9): a dark see-through card on the photo's bottom left with a
   line chart, bars or rings. It rises in when scrolled into view, then the graph draws. */
.gfx-wrap { position: relative; }
.gfx { position: absolute; left: 8%; bottom: 8%; z-index: 3; width: min(340px, 84%); box-sizing: border-box; padding: 20px; border-radius: 18px; background: rgba(28,32,38,0.55); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12); color: #fff; display: flex; flex-direction: column; gap: 14px; }
.gfx small { font-size: 12px; line-height: 16px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }
.gfx.gfx-empty { gap: 8px; padding: 12px; }
.gfx-empty .slot { min-height: 40px; padding: 8px; font-size: 14px; }
.gfx .hstat-chart { height: auto; }
.gfx .hstat-key b { font-size: 26px; line-height: 28px; }
.gfx-plot { display: block; width: 100%; height: auto; overflow: visible; }
.gfx-plot text { fill: rgba(255,255,255,0.75); font-size: 10px; font-family: inherit; }
.gfx-bar { fill: var(--gc, var(--cm-azure)); transform-box: fill-box; transform-origin: 50% 100%; }
.gfx-rings { display: flex; justify-content: space-around; gap: 16px; }
.gfx-ring { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; max-width: 128px; }
.gfx-ring > span { font-size: 15px; line-height: 20px; }
.gfx-dial { position: relative; width: 104px; aspect-ratio: 1; }
.gfx-dial svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.gfx-track, .gfx-arc { fill: none; stroke-width: 10; }
.gfx-track { stroke: rgba(255,255,255,0.2); }
.gfx-arc { stroke: var(--gc, var(--cm-azure)); stroke-linecap: round; }
.gfx-dial b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
@keyframes bar-grow { from { transform: scaleY(0); } }
@keyframes ring-draw { from { stroke-dasharray: 0 100; } }
.gfx.wait { opacity: 0; }
.gfx.play { animation: rise-in 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.gfx.play .hstat-a { animation: line-draw 1.6s cubic-bezier(0.4, 0, 0.2, 1) 0.6s both; }
.gfx.play .hstat-b { animation: line-draw 1.6s cubic-bezier(0.4, 0, 0.2, 1) 0.75s both; }
.gfx.play .hstat-area { animation: area-in 1.6s cubic-bezier(0.4, 0, 0.2, 1) 0.75s both; }
.gfx.play .gfx-bar { animation: bar-grow 1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.6s both; }
.gfx.play .gfx-arc { animation: ring-draw 1.6s cubic-bezier(0.4, 0, 0.2, 1) 0.6s both; }
@media (prefers-reduced-motion: reduce) { .gfx.play, .gfx.play :is(.hstat-a, .hstat-b, .hstat-area, .gfx-bar, .gfx-arc) { animation: none; } }
@container (max-width: 700px) {
  .gfx { left: 6%; bottom: 6%; width: 88%; padding: 16px; }
  .gfx-dial { width: 88px; }
  .gfx-dial b { font-size: 19px; }
}

.cred { background: var(--cm-charcoal); color: #fff; padding: 96px 64px 224px; display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: center; }
/* Tagline: one size on every template (styles/typography.css): 16px desktop, 14px tablet, 12px phone; spacing 3px. */
.tagline, .mail .tagline { font-size: 16px; line-height: 16px; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; margin: 0; }
.logo-row { display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: flex-end; }
.logo-row img { height: 24px; width: auto; max-width: 200px; object-fit: contain; }

.std { padding: 96px 64px; display: flex; flex-direction: column; gap: 48px; }
.sh { display: grid; grid-template-columns: 1fr 2fr; gap: 32px; align-items: start; }
.sh h2 { font-size: 56px; line-height: 1; letter-spacing: -2.5px; font-weight: 300; margin: 0; }
.sh h2 span { display: block; }
.sh p.body { font-size: 20px; line-height: 1.45; color: var(--cm-iron); margin: 16px 0 0; max-width: 640px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
.split :is(img, video).photo { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 18px; background: var(--cm-clay); }
.split .slot.photo { aspect-ratio: 4 / 5; }
.points { display: flex; flex-direction: column; gap: 24px; }
.point { border-top: 1px solid var(--cm-clay); padding-top: 16px; display: grid; grid-template-columns: 1fr; gap: 16px; }
.point b { font-size: 22px; letter-spacing: -0.5px; line-height: 1.1; }
.point p { margin: 0; color: var(--cm-iron); font-size: 17px; }
.point .stat { font-size: 15px; color: var(--cm-azure); font-weight: 700; display: block; margin-top: 6px; }

.plat { color: #fff; background: var(--cm-midnight); overflow: hidden; min-height: 760px; justify-content: space-between; }
.plat-foot { display: flex; flex-direction: column; gap: 48px; }
.plat .hero-bg::after { background: rgba(28,32,38,0.55); }
.plat > *:not(.hero-bg):not(.sec-tag) { position: relative; z-index: 2; }
.tag-pills { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin: 0; padding: 0; }
.tag-pills li { border: 1.5px solid currentColor; border-radius: 999px; padding: 6px 16px; font-size: 15px; }
.tag-pills li::before { content: "+ "; }
.plat-logos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 32px; align-items: center; }
.plat-logos img { max-width: 100%; height: 36px; object-fit: contain; }

.offer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px; }
.offer { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 5; color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 32px; background: var(--cm-midnight); }
.offer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.offer::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(28,32,38,0.55), rgba(28,32,38,0.1) 45%, rgba(28,32,38,0.75)); }
.offer > * { position: relative; z-index: 1; }
.offer h3 { font-size: 36px; line-height: 1; letter-spacing: -1.5px; font-weight: 700; margin: 0; }
.offer p { margin: 8px 0 0; font-size: 17px; }
.offer .foot { border-top: 1px solid rgba(255,255,255,0.7); padding-top: 16px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.offer .price { font-size: 30px; font-weight: 700; letter-spacing: -1px; text-align: right; }
.offer .price small { display: block; font-size: 12px; font-weight: 400; letter-spacing: 0; }
.offer .slot { aspect-ratio: auto; }
.offer-slot { aspect-ratio: 4 / 5; }

.quote-sec { background: var(--cm-clay); }
.quote-sec blockquote { margin: 0; font-size: 40px; line-height: 1.15; letter-spacing: -1px; font-weight: 300; max-width: 980px; }
.quote-sec cite { font-style: normal; font-size: 17px; color: var(--cm-iron); }

.mail { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; padding: 96px 64px; background: var(--cm-white); }
.mail h2 { font-size: 52px; line-height: 1; letter-spacing: -2px; font-weight: 700; margin: 8px 0 16px; }
.mail p { font-size: 20px; color: var(--cm-iron); margin: 0; }
.fake-form { display: flex; flex-direction: column; gap: 16px; }
.mail-thanks { margin: 0; font-size: 14px !important; color: var(--cm-iron); }
.mail-thanks::before { content: "After sign-up: "; color: var(--cm-taupe); }
.fake-form div { border: 1px solid var(--cm-clay); border-radius: 8px; padding: 14px 16px; color: var(--cm-taupe); }

.site-footer { background: var(--cm-charcoal); color: #fff; padding: 64px; display: flex; flex-direction: column; gap: 64px; font-size: 20px; line-height: 24px; letter-spacing: -1px; }
.site-footer img { width: 136px; height: auto; display: block; }
.site-footer p { margin: 0; }
.foot-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; }
.foot-col { display: flex; flex-direction: column; gap: 16px; }
.foot-col .u { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.foot-legal { display: grid; grid-template-columns: minmax(max-content, 2fr) 1fr 1fr auto; align-items: center; gap: 32px; padding-top: 64px; border-top: 1px solid #fff; }
.foot-top-link { width: 32px; height: 32px; display: grid; place-items: center; }
.foot-top-link svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#site [data-chrome] { cursor: pointer; }
#site.guides [data-chrome]:hover { outline: 2px dashed var(--cm-azure); outline-offset: -2px; }
#site [data-chrome].is-current { outline: 3px solid var(--cm-azure); outline-offset: -3px; }
/* Global nav / Footer editor */
.lay-pinned .lay-head { cursor: pointer; }
.lay-pinned .chip { font-size: 10px; padding: 1px 6px; }
.chrome-ed { display: flex; flex-direction: column; gap: 14px; }
.chrome-ed h3 { margin: 0; font-size: 15px; }
/* Edit panel (Oct 8): looks like the left panel. Fixed down the right on laptops (stays put while
   the page scrolls), its own scroll, sections that fold. Phones keep it under the Edit tab. */
#cards.ed-panel { gap: 0; }
.ed-blk { padding: 12px 8px; }
.ed-blk .blk-title { cursor: pointer; }
.ed-blk .blk-title > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-blk .ed-extra { display: inline-flex; gap: 4px; flex: none; text-transform: none; letter-spacing: 0; font-weight: 600; }
.ed-blk .ed-extra .chip, .ed-blk .ed-extra .pill { font-size: 10px; padding: 1px 6px; }
.ed-body { padding: 4px 8px 4px; display: flex; flex-direction: column; gap: 12px; }
.ed-body .chrome-ed, .ed-body .ccard-body { gap: 12px; padding: 0; }
.ed-body .ccard { background: none; border: 0; box-shadow: none; border-radius: 0; }
.ed-body .ccard.drop-ok { background: color-mix(in srgb, var(--accent) 14%, transparent); outline: 2px dashed var(--accent); }
.ed-body .spot-list { background: none; border: 0; padding: 0; }
.ed-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: -4px; }
.ed-rows { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; }
.ed-rows .lay-head { font-weight: 600; }
.ed-rows .sub { max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-rows .lay-row:hover .sub, .ed-rows .lay-row:focus-within .sub { display: none; }
.ed-body .ed-in { padding: 4px 8px 12px 30px; gap: 10px; }
.ed-body .note { background: none; border: 0; padding: 0; color: var(--ink-3); }
.ed-sub { color: var(--ink-3); font-size: 11.5px; font-weight: 400; text-transform: none; letter-spacing: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (min-width: 761px) {
  :root { --edit-w: 320px; }
  html.has-edit body { padding-right: calc(var(--edit-w) + 16px); }
  .panes { grid-template-columns: minmax(0, 1fr); }
  .pane-cards { position: fixed; top: 0; bottom: 0; right: 0; width: var(--edit-w); z-index: 35; background: var(--panel-2); border-left: 1px solid var(--line); overflow: auto; overscroll-behavior: contain; gap: 0; }
  .edit-float { position: static; gap: 0; }
}
.chrome-ed .note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--ink-2); }
.chrome-ed .row-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.chrome-ed .source { margin: 6px 0 0; font-size: 12px; line-height: 1.45; color: var(--ink-3); overflow-wrap: anywhere; }
.chrome-ed .field > label { display: block; margin-bottom: 6px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.chrome-ed .seg + .note { margin-top: -4px; }
.chrome-ed .group-label { margin: 6px 0 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }

.page-hero { min-height: 520px; }
.calendly { border: 1px solid var(--cm-clay); border-radius: 18px; background: #fff; padding: 48px; text-align: center; color: var(--cm-iron); font-size: 18px; }

/* Tablet-width page: points go back to title beside text (photo sits above). */

  .tagline, .mail .tagline { font-size: 14px; line-height: 14px; }
  .split { grid-template-columns: 1fr; gap: 32px; }
  .site-nav { padding: 32px; }
  .site-footer { padding: 40px; gap: 48px; font-size: 16px; line-height: 20px; }
  .foot-top { flex-direction: column; align-items: flex-start; gap: 48px; }
  .foot-col { gap: 12px; }
  .foot-legal { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; padding-top: 48px; }
  .foot-legal .foot-copy { order: 3; }

  .site-nav ul { display: none; }

  .cred { grid-template-columns: 1fr; padding: 48px 32px 96px; }
  .logo-row { justify-content: space-between; }
  .logo-row img { height: 24px; }

  .plat { min-height: 0; }
  .hero h1 { font-size: 56px; line-height: 54px; letter-spacing: -2px; }
  .hero-bottom:has(.hstat) { flex-direction: column; align-items: flex-start; gap: 16px; }

}
/* Phone-width page: same blocks, stacked. */

  .site-nav { padding: 20px; }

  .nav-menu-cta { align-self: stretch; text-align: center; }
  .hero { min-height: 680px; padding: 120px 20px 32px; }

  .cta { align-self: stretch; justify-content: center; }
  .cred { grid-template-columns: 1fr; padding: 32px 20px 96px; }
  .logo-row { justify-content: flex-start; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .logo-row img { height: 20px; object-position: left center; }
  .std, .mail { padding: 64px 20px; }

.sys { padding: 64px; display: flex; flex-direction: column; justify-content: space-between; gap: 96px; min-height: 0; }

// ── Preview sizing: draw at 1280 (desktop) or 390 (phone) and shrink to fit ──
// The page's breakpoints (the @container rules above and in components/builder-site.css):

function fit() {
  const wrap = $("#canvas-wrap"), sc = $("#canvas-scale"), site = $("#site");
  const w = { phone: 390, tablet: 768 }[S.device] || 1280;
  site.style.width = w + "px";
  site.style.setProperty("--screen-h", ({ phone: 844, tablet: 1024 }[S.device] || 800) + "px");  // full-screen hero: one screen tall
  const avail = wrap.clientWidth - 32;
  const k = Math.min(1, avail / w);
  sc.style.transform = `scale(${k})`;
  sc.style.width = w + "px";
  sc.style.height = site.offsetHeight + "px";
  wrap.style.height = site.offsetHeight * k + 32 + "px";
  wrap.classList.toggle("phone", S.device !== "desktop");
  if (S.device !== "desktop") sc.style.marginLeft = Math.max(0, (avail - w * k) / 2) + "px"; else sc.style.marginLeft = "0";

}

// ── Links: a page on this site (kept as "page:<id>", optionally "#<section>", so it follows
// the page if its address changes) or a web address (https://… or mailto:…). Links apply at once.
const linkMode = {};
const URL_OK = (u) => /^https:\/\/[^\s"'<>]+\.[^\s"'<>]+$/i.test(u) || /^mailto:[^\s"'<>@]+@[^\s"'<>]+$/i.test(u) || (/^\/[a-z0-9._\/#?=&-]*$/i.test(u) && !u.startsWith("//"));
// Link names (#anchors): a section, or one element in it, can be given a name so links can
// jump straight to it (clearmark.bz/#solutions). Names live in S.anchors, keyed by the
// section's id ("<uid>") or the element's spot id ("<uid>.<key>"). Links store that key, not
// the name, so renaming never breaks a link. A section with no name uses its id; an element
// with no name can't be linked to.
const ANCHOR_RE = /^[a-z][a-z0-9-]{0,39}$/;
function pageRefs(pid) {
  const out = [];
  for (const sec of pageView(pid).sections) {
    out.push({ ref: sec.id, label: sec.name, el: false });
    for (const sl of sec.slots) if (S.anchors?.[sl.id]) out.push({ ref: sl.id, label: `${sec.name} › ${sl.label}`, el: true });
  }
  return out;
}
// ref → name for one page (first use of a name wins; a clash falls back to the section's id).
function anchorMap(pid) {
  const m = {}, used = new Set();
  for (const r of pageRefs(pid)) {
    const a = S.anchors?.[r.ref], name = a && ANCHOR_RE.test(a) && !used.has(a) ? a : r.el ? "" : r.ref;
    if (name && !used.has(name)) { m[r.ref] = name; used.add(name); }
  }
  return m;
}
function anchorProblem(ref, name) {
  if (!name) return "";
  if (!ANCHOR_RE.test(name)) return "Use lower-case letters, numbers and dashes, starting with a letter (e.g. solutions).";
  const m = anchorMap(S.page);
  if (Object.entries(m).some(([r, a]) => r !== ref && a === name)) return `Another part of this page is already called #${name}.`;
  return "";
}
function resolveLink(v) {
  v = String(v || "");
  if (!v.startsWith("page:")) return v;
  const [pid, ref] = v.slice(5).split("#"), p = PAGE_LIST.find((x) => x.id === pid);
  if (!p) return "";
  const m = ref ? anchorMap(pid) : {}, a = ref ? m[ref] || m[ref.split(".")[0]] || "" : "";
  return p.path + (a ? "#" + a : "");
}
// The "Link name" field, under a section's spot list or an element's card.
function anchorField(ref, el) {
  const v = S.anchors?.[ref] || "", m = anchorMap(S.page), now = m[ref] || "", page = PAGE_LIST.find((x) => x.id === S.page);
  const fid = "anc-" + ref.replace(/\W/g, "-"), url = page && now ? SITE_URL + page.path + "#" + now : "";
  return `<div class="field anchor-ed">
    <div class="anchor-in"><span aria-hidden="true">#</span><input class="input" id="${fid}" aria-label="Link name${el ? " (optional)" : ""}" data-anchor="${ref}" value="${esc(v)}" placeholder="${esc(el ? "e.g. pricing-button" : ref)}" autocapitalize="off" spellcheck="false" maxlength="40"></div>
    <small class="slug-err" id="${fid}-err"></small>
    ${url ? `<p class="source">Link: <a class="set-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(page.path + "#" + now)}</a><button type="button" class="btn" data-copyanchor="${esc(url)}">Copy</button></p>` : ""}</div>`;
}
function linkEditor(id) {
  const v = String(S.slots[id].placed || S.slots[id].value || ""), mode = linkMode[id] || (v && !v.startsWith("page:") ? "url" : "page");
  const [pid, sec] = v.startsWith("page:") ? v.slice(5).split("#") : ["", ""];
  const target = PAGE_LIST.find((p) => p.id === pid), now = resolveLink(v);
  const body = mode === "page"
    ? `<select class="input" data-linkpage="${id}" aria-label="Page"><option value="">Choose a page…</option>${PAGE_LIST.map((p) => `<option value="${p.id}" ${p.id === pid ? "selected" : ""}>${esc(p.name)} · ${esc(p.path)}</option>`).join("")}</select>
       ${target ? `<select class="input" data-linksec="${id}" aria-label="Part of the page"><option value="">Top of the page</option>${(() => { const m = anchorMap(target.id); return pageRefs(target.id).map((x) => `<option value="${x.ref}" ${x.ref === sec ? "selected" : ""}>${x.el ? "↳ " : ""}${esc(x.label)} · #${esc(m[x.ref] || "")}</option>`).join(""); })()}</select>` : ""}`
    : `<input class="input" data-linkurl="${id}" value="${esc(v.startsWith("page:") ? "" : v)}" inputmode="url" placeholder="https://calendly.com/… or mailto:you@clearmark.bz" autocapitalize="off" spellcheck="false"><small class="slug-err" id="link-err-${id.replace(/\W/g, "-")}"></small>`;
  return `<div class="field link-ed"><label>Button goes to</label>
    <div class="seg" role="group" aria-label="Link type"><button type="button" data-linkmode="${id}:page" aria-pressed="${mode === "page"}">Page on this site</button><button type="button" data-linkmode="${id}:url" aria-pressed="${mode === "url"}">Web address</button></div>
    ${body}
    <p class="source">${now ? `Now: <a class="set-link" href="${esc(now.startsWith("/") ? SITE_URL + now : now)}" target="_blank" rel="noopener noreferrer">${esc(now)} ↗</a>${now.startsWith("http") ? " · opens in a new tab" : ""}` : "Not linked yet: the button stays hidden on the live site until it has a link."}</p></div>`;
}

// ── Putting content into a spot ──
// Revert: every change to a spot (typing, dropping, placing, clearing, reordering, cropping)
// first keeps a copy of how it was, so "Revert" steps back one change at a time (last 30).
const HIST = {};
const takeSnap = (id) => structuredClone({ value: S.slots[id].value, placed: S.slots[id].placed, crop: S.crop?.[id] ?? null });
function pushSnap(id, snap) { const h = (HIST[id] ||= []); if (!h.length || !same(h[h.length - 1].s, snap)) h.push({ s: snap, t: Date.now() }); if (h.length > 30) h.shift(); }
// A button's card reverts its text or its link, whichever changed last.
function revertTarget(id) {
  const sl = SLOTS[id], link = sl?.key === "button" ? `${sl.section}.link` : null;
  const last = (x) => HIST[x]?.[HIST[x].length - 1]?.t || 0;
  return link && last(link) > last(id) ? link : id;
}
const snap = (id) => S.slots[id] && pushSnap(id, takeSnap(id));
function revert(id) {
  const showId = id; id = revertTarget(id);
  const prev = HIST[id]?.pop()?.s; if (!prev) return;
  S.slots[id] = { value: prev.value, placed: prev.placed };
  S.crop ||= {}; if (prev.crop) S.crop[id] = prev.crop; else delete S.crop[id];
  selected = openCard = SLOTS[showId] ? showId : id; render(); toast("Reverted to how it was before your last change.");
}
function fill(id, p, place) {
  const sl = SLOTS[id], st = S.slots[id];
  if (!accepts(sl, p)) { toast(`${sl.label} takes ${sl.kind === "offers" ? "offer cards" : sl.kind === "embed" ? "a video" : sl.kind === "logos" ? "images (not video)" : sl.kind === "image" ? "images or video" : "text"}.`); return; }
  snap(id);
  if (sl.kind === "image" || sl.kind === "embed") st.value = p.value;
  else if (sl.kind === "logos") { if (st.value.length >= sl.max) return toast(`${sl.label} holds up to ${sl.max}.`); if (!st.value.includes(p.value)) st.value = [...st.value, p.value]; }
  else if (sl.kind === "offers") { if (st.value.length >= sl.max) return toast(`${sl.label} holds up to ${sl.max}.`); if (!st.value.includes(p.value)) st.value = [...st.value, p.value]; }
  else if (sl.kind === "text") st.value = p.value;
  else if (sl.kind === "list") {
    const key = sl.cols[sl.cols.length - 1].key;
    if (st.value.length >= sl.max) return toast(`${sl.label} holds up to ${sl.max} rows.`);
    st.value = [...st.value, Object.fromEntries(sl.cols.map((c) => [c.key, c.key === key ? p.value : ""]))];
  }
  if (place && !overLimit(id)) st.placed = structuredClone(st.value);
  if (place && overLimit(id)) toast("Added as a draft: it's over the limit, so shorten it to place it.");
  selected = id; openCard = id; picked = null;
  save(); render();
}

let INTRO_PLAYED = false;
// Photo + text graphs play once each (per section and graph type) when scrolled into view.
const GFX_PLAYED = new Set(); let gfxObs;
function playGraphs() {
  gfxObs?.disconnect();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  gfxObs = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    const el = e.target; gfxObs.unobserve(el); GFX_PLAYED.add(el.dataset.gfx);
    el.classList.remove("wait"); el.classList.add("play"); countUp(el);
  }), { threshold: 0.4 });
  document.querySelectorAll("#site .gfx").forEach((el) => { if (!GFX_PLAYED.has(el.dataset.gfx)) { el.classList.add("wait"); gfxObs.observe(el); } });

// ── Uploads (images and video). Live Studio sends the file straight to Supabase Storage
// with a one-time link from the Studio API, and remembers it in the draft (S.media) so it
// stays in Sources. The prototype keeps uploads in this browser only.
const MB = 1048576;
// The upload in progress: { name, loaded, total, stop }. While set, Sources shows a progress
// bar (with Cancel) in place of the upload box, so only one file goes up at a time.
let UP = null;
const mb = (n) => (n / MB).toFixed(n < 10 * MB ? 1 : 0);
function upBox() {
  const pct = UP.total ? Math.round((UP.loaded / UP.total) * 100) : 0;
  return `<div class="upload is-busy" role="status" aria-live="polite"><span class="up-name">${UP.saving ? "Saving" : "Uploading"} ${esc(UP.name)}</span><div class="up-bar" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><div class="up-row"><small>${pct}% · ${mb(UP.loaded)} of ${mb(UP.total)} MB</small>${UP.saving ? "" : `<button type="button" class="btn" data-up-cancel>Cancel</button>`}</div></div>`;
}
// Update the bar in place (no full redraw on every progress tick).
function upPaint() {
  const box = document.querySelector("#side .upload.is-busy");
  if (!box || !UP) return renderSources();
  const pct = UP.total ? Math.round((UP.loaded / UP.total) * 100) : 0;
  box.querySelector(".up-bar i").style.width = pct + "%";
  box.querySelector(".up-bar").setAttribute("aria-valuenow", pct);
  box.querySelector(".up-row small").textContent = `${pct}% · ${mb(UP.loaded)} of ${mb(UP.total)} MB`;
}
const upDone = () => { UP = null; renderSources(); };
document.addEventListener("click", (e) => { if (e.target.closest?.("[data-up-cancel]") && UP) { UP.stop?.(); upDone(); toast("Upload cancelled."); } });
async function uploadMedia(f) {
  if (UP) return toast("One upload at a time: wait for this one to finish.");
  const video = f.type.startsWith("video/");
  if (video && !/^video\/(mp4|webm)$/.test(f.type)) return toast("Videos need to be MP4 or WebM.");
  if (!video && !/^image\/(jpeg|png|webp|gif|avif)$/.test(f.type)) return toast("Images need to be JPG, PNG, WebP, GIF or AVIF.");
  if (f.size > 50 * MB) return toast("That file is over 50 MB, the most Supabase takes. Shorten or compress it first.");
  const big = video && f.size > 8 * MB ? ` It's ${(f.size / MB).toFixed(1)} MB: every visit downloads it, so aim for under 5 MB for backgrounds.` : "";
  const add = (src, keep) => {
    IMAGES.unshift({ id: "up-" + Date.now(), src, name: f.name, kind: video ? "video" : "photo" });
    if (keep) { (S.media ||= []).unshift({ src, name: f.name.slice(0, 80), kind: video ? "video" : "photo" }); save(); }
    UI.src.add("images"); UP = null; renderSources();
    toast(`Added to Images & video. Drag it onto a photo, a background or a Video module.${big}`);
  };
  UP = { name: f.name, loaded: 0, total: f.size };
  UI.src.add("images"); renderSources();
  if (!LIVE) {
    // Prototype: the file is read into this browser; the bar shows the read.
    if (!video && f.size > 3e6) { upDone(); return toast("Pick an image under 3 MB for the prototype."); }
    const r = new FileReader();
    UP.stop = () => r.abort();
    r.onprogress = (ev) => { if (UP && ev.lengthComputable) { UP.loaded = ev.loaded; upPaint(); } };
    r.onload = () => { if (!UP) return; UP.loaded = f.size; upPaint(); add(video ? URL.createObjectURL(f) : r.result, false); };
    r.onerror = () => { upDone(); toast("Couldn't read that file."); };
    if (video) r.readAsArrayBuffer(f); else r.readAsDataURL(f);
    return;
  }
  try {
    const res = await fetch(API + "?action=upload-url", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ type: f.type, size: f.size }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || "Couldn't start the upload");
    if (!UP) return;  // cancelled meanwhile
    const fd = new FormData(); fd.append("cacheControl", "31536000"); fd.append("", f);
    // XMLHttpRequest (not fetch) so the bar can follow the upload.
    await new Promise((ok, fail) => {
      const x = new XMLHttpRequest();
      UP.stop = () => x.abort();
      x.open("PUT", j.uploadUrl); x.setRequestHeader("x-upsert", "false");
      x.upload.onprogress = (ev) => { if (UP && ev.lengthComputable) { UP.loaded = Math.min(f.size, ev.loaded); upPaint(); } };
      x.upload.onload = () => { if (UP) { UP.loaded = f.size; UP.saving = true; renderSources(); } };
      x.onload = () => (x.status >= 200 && x.status < 300 ? ok() : fail(new Error("The upload didn't finish. Try again.")));
      x.onerror = () => fail(new Error("The upload stopped: check your connection and try again."));
      x.onabort = () => fail(null);
      x.send(fd);
    });
    add(j.publicUrl, true);
  } catch (e) { if (UP) upDone(); if (e) toast(e.message); }
}

let sd = null, suppressClick = false;

const ITEM_NAME = (slot, i) => {

  if (SLOTS[slot].kind === "offers") return offerById(v)?.title;

};
document.addEventListener("pointerdown", (e) => {
  if (e.button > 0 || e.target.closest("button, input, label, select, textarea")) return;
  const tpl = e.target.closest("[data-tpldrag]");
  const sec = !tpl && e.target.closest("[data-secdrag]");
  const item = !tpl && !sec && e.target.closest("#site [data-item]");
  const photo = !tpl && !sec && !item && e.target.closest("#site [data-photoflip]");
  if (!tpl && !sec && !item && !photo) return;
  e.preventDefault();
  const base = { x: e.clientX, y: e.clientY, started: false, target: null, after: false };
  if (tpl) sd = { ...base, mode: "template", tpl: tpl.dataset.tpldrag, scope: "#site" };
  else if (sec) sd = { ...base, mode: "section", id: sec.dataset.secdrag, scope: sec.closest("#site") ? "#site" : sec.closest("#side") ? "#side" : "#cards" };
  else if (item) { const [slot, i] = item.dataset.item.split(":"); sd = { ...base, mode: "item", slot, from: +i, axis: SLOTS[slot].axis === "x" ? "x" : "y" }; }

document.addEventListener("pointermove", (e) => {

  if (wordCount(it.cs) > 144) return err("Content short is up to 144 words.");

  if (CMS.some((x) => x.collection === it.collection && x.slug === it.slug && x.id !== it.id)) return err("Another item already uses that slug.");

      const j = await res.json().catch(() => ({}));

  } else {

let deleteArmed = null;

function pageCard(p) {

// ── Popovers ──

function closePops(except) { for (const [id, btn] of [["#logo-menu", "#rail-logo"], ["#sidebar-menu", "[data-sidebar-menu]"]]) if (id !== except) { $(id).hidden = true; $(btn).setAttribute("aria-expanded", "false"); } }
const DASH = (LIVE ? "" : BASE_DOMAIN) + "/clrcrm/studio";
$("#logo-menu").innerHTML = `<div class="side-label">Sites</div>

  <hr>
  <a class="side-row" href="${DASH}">${svg('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>')}<span class="grow">Main dashboard</span></a>

// ── Events ──
function railGo(r, fromHover) {
  if (!fromHover && r === UI.rail && UI.open && viewFor(r) === NAV_VIEW) UI.open = false;
  else { UI.rail = r; UI.open = true; }

// In Collapsed / Expand-on-hover (and on phones) the panel floats; it closes after you pick something.
const closeIfFloating = () => { if (!docked() && UI.open) { UI.open = false; UI.cat = null; applyNav(); } };
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a, [data-page], [data-navsec], [data-navslot], [data-pick], [data-blocktoggle], [data-cmsitem]");
  if (!t) return;
  const d = t.dataset;
  if (d.blocktoggle) { if (blockMoved) return; const b = d.blocktoggle; UI.closed.has(b) ? UI.closed.delete(b) : UI.closed.add(b); saveUI(); renderSide(); return; }
  if (d.srcgroup) { UI.src.has(d.srcgroup) ? UI.src.delete(d.srcgroup) : UI.src.add(d.srcgroup); renderSources(); return; }
  // Phones can't drag: tap a source, the panel closes, then tap a dotted box.

  }

  if (d.navClosePop != null) return closePops();
  if (d.addpageOpen != null) { UI.adding = !UI.adding; renderSide(); if (UI.adding) $("#np-name")?.focus(); return; }
  if (d.addpageCancel != null) { UI.adding = false; renderSide(); return; }
  if (d.addpage != null) return addPage();
  if (d.delpage) return deletePage(d.delpage);
  if (d.rail) return railGo(d.rail, false);
  // "Add a section": open the Modules block in the Pages panel and bring it into view.
  if (d.modsFocus != null) {
    UI.rail = "pages"; UI.open = true; NAV_VIEW = "editor"; UI.closed.delete("modules"); if (!UI.mods.size) UI.mods.add("heroes");
    saveUI(); applyNav(); document.querySelector('#side [data-block="modules"]')?.scrollIntoView({ behavior: "smooth", block: "start" }); return;
  }
  if (d.navClose != null) { UI.open = false; UI.cat = null; applyNav(); return; }
  if (d.navBack != null) { NAV_VIEW = "editor"; if (UI.rail === "cms" || UI.rail === "settings") UI.rail = "pages"; saveUI(); applyNav(); return; }
  if (d.pub != null) return publishPage();
  if (d.savework != null) return saveWork();
  if (d.unpub != null) return unpublishPage();
  if (d.modgroup) { UI.mods.has(d.modgroup) ? UI.mods.delete(d.modgroup) : UI.mods.add(d.modgroup); renderModules(); return; }
  if (t.dataset.cmsitem) { openCmsItem(t.dataset.cmsitem); return; }
  if (d.cmsnew != null) { openCmsItem("new"); return; }
  if (d.cmsback != null) { if (cmsDirty && !cmsLeaveArmed) { cmsLeaveArmed = true; renderCms(); setTimeout(() => { cmsLeaveArmed = false; if (cmsEdit) renderCms(); }, 4000); return; } cmsEdit = null; renderCms(); return; }
  if (d.cmsdiscard != null) { openCmsItem(cmsEdit?.id || "new"); toast("Changes discarded."); return; }
  if (d.cmssave != null) return saveCmsItem();
  if (d.cmsstatus && cmsEdit) { cmsEdit.status = d.cmsstatus; cmsDirty = true; renderCms(); return; }
  if ((d.cmsmore != null || d.cmsvid != null) && cmsEdit) {

    const list = cmsEdit.media.filter(inList), on = list.some((m) => m.url === url);

    const next = on ? list.filter((m) => m.url !== url) : [...list, { code: "", url, alt: "" }];
    // Renumber: images from CI-02 (CI-01 is the main image), videos from CV-01.
    next.forEach((m, n) => (m.code = pre + String(n + (video ? 1 : 2)).padStart(2, "0")));

    // Click a section: open it (and select it); click the open one again to fold it.

    else { UI.exp.add(sec.id); curSec = sec.id; selected = openCard = null; }
    NAV_VIEW = "editor"; render(); applyNav(); if (curSec) scrollToSection(sec.id); return;
  }

  if (d.addtpl && !t.isConnected) { if (isPhone()) setTab("preview"); closeIfFloating(); return; }
});
// Clicking outside closes popovers, and a floating panel.
document.addEventListener("pointerdown", (e) => {

// Expand on hover: point at an icon to open its panel; move away to close it.

});
// Settings fields save as you type.
document.addEventListener("input", (e) => {
  const t = e.target;

    if (k === "cpdt") cmsEdit.cpdt = v.split("\n").map((l) => l.trim()).filter(Boolean);
    else if (k === "tags") cmsEdit.tags = v.split(",").map((l) => l.trim()).filter(Boolean);
    else if (k === "alt") { const m = cmsEdit.media.find((x) => x.code === "CI-01"); if (m) m.alt = v; }

    else cmsEdit[k] = v;
    if (k === "ct100" && !cmsEdit.slugTouched) { cmsEdit.slug = slugify(v); const sl = $('[data-cf="slug"]'); if (sl) sl.value = cmsEdit.slug; }

document.addEventListener("change", (e) => {

addEventListener("resize", () => { document.documentElement.dataset.docked = docked(); });

// Move Pages, Layers and Sources above or below each other: drag a block by its title.
let bd = null, blockMoved = false;
document.addEventListener("pointerdown", (e) => {
  const h = e.target.closest("#side [data-blockdrag]");
  if (!h || e.button > 0 || e.target.closest("button, input, select")) return;

});
document.addEventListener("pointermove", (e) => {
  if (!bd) return;
  if (!bd.started) { if (Math.abs(e.clientY - bd.y) < 6) return; bd.started = true; document.querySelector(`#side [data-block="${bd.id}"]`)?.classList.add("is-moving"); document.body.classList.add("is-dragging"); }
  document.querySelectorAll("#side [data-block]").forEach((x) => x.classList.remove("drop-before", "drop-after"));
  const el = document.elementFromPoint(e.clientX, e.clientY)?.closest("#side [data-block]");
  bd.target = null;
  if (el && el.dataset.block !== bd.id) { const r = el.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2; el.classList.add(after ? "drop-after" : "drop-before"); bd.target = el.dataset.block; bd.after = after; }
});

  if (!bd) return;
  const d = bd; bd = null; document.body.classList.remove("is-dragging");
  if (!d.started) return;

  if (d.target) { const o = UI.blocks.filter((x) => x !== d.id); const i = o.indexOf(d.target); o.splice(d.after ? i + 1 : i, 0, d.id); UI.blocks = o; saveUI(); }
  renderSide();
});

// Make a block taller or shorter by dragging the line under it. Double-click the line to reset.
let bh = null;
document.addEventListener("pointerdown", (e) => {
  const line = e.target.closest?.("#side [data-blkresize]"); if (!line || e.button > 0) return;
  e.preventDefault();
  const id = line.dataset.blkresize, body = document.querySelector(`#side [data-blkbody="${id}"]`);

});

document.addEventListener("pointerup", () => { if (!bh) return; if (bh.now) { UI.h[bh.id] = bh.now; saveUI(); } bh = null; document.body.classList.remove("is-resizing-v"); });
document.addEventListener("dblclick", (e) => { const line = e.target.closest?.("#side [data-blkresize]"); if (!line) return; delete UI.h[line.dataset.blkresize]; saveUI(); renderSide(); });

// Resize the panel by dragging its right edge. Past the narrowest size, letting go closes it.
const SIDE_MIN = 220, SIDE_MAX = 520, SIDE_CLOSE = SIDE_MIN - 70;
let rz = null;
$("#side-resize").addEventListener("pointerdown", (e) => { if (e.button > 0) return; e.preventDefault(); rz = { x: e.clientX, w: UI.w, now: UI.w }; $("#side-resize").setPointerCapture(e.pointerId); document.body.classList.add("is-resizing"); });
$("#side-resize").addEventListener("pointermove", (e) => {
  if (!rz) return;
  rz.now = rz.w + (e.clientX - rz.x);
  document.documentElement.style.setProperty("--side-w", Math.min(SIDE_MAX, Math.max(SIDE_MIN, rz.now)) + "px");
  $("#side").classList.toggle("will-close", rz.now < SIDE_CLOSE);
  fit();
});
const endResize = () => {
  if (!rz) return;
  const w = rz.now; rz = null; document.body.classList.remove("is-resizing"); $("#side").classList.remove("will-close");
  if (w < SIDE_CLOSE) { document.documentElement.style.setProperty("--side-w", UI.w + "px"); UI.open = false; UI.cat = null; applyNav(); toast("Panel closed. Click an icon on the left to open it again."); return; }
  UI.w = Math.round(Math.min(SIDE_MAX, Math.max(SIDE_MIN, w))); saveUI(); fit();
};
$("#side-resize").addEventListener("pointerup", endResize);
$("#side-resize").addEventListener("pointercancel", endResize);
applyNav();

// Crop: press or drag on the photo in the Edit pane to set its focus point.
let cropping = null;
function setCrop(e) {
  const r = cropping.el.getBoundingClientRect();
  const x = Math.round(Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100)));
  const y = Math.round(Math.min(100, Math.max(0, ((e.clientY - r.top) / r.height) * 100)));
  setCropAt(cropping.id, S.device, { x, y, z: zoomOf(cropAt(cropping.id, S.device)) });
  applyCrop(cropping.id);
}
// Show the current crop on the Edit pane photo and in the preview, without redrawing everything.
function applyCrop(id) {
  const c = cropAt(id, S.device), css = cssOf(c, true), frame = document.querySelector(`[data-crop="${id}"]`);
  applyCropRules();
  const set = (im) => { im.style.objectPosition = ""; im.style.transform = ""; im.style.transformOrigin = ""; im.style.cssText += ";" + css; };
  if (frame) {
    set(frame.querySelector("img, video"));
    Object.assign(frame.querySelector(".crop-dot").style, { left: (c ? c.x : 50) + "%", top: (c ? c.y : 50) + "%" });
    frame.querySelector(".crop-z").textContent = zoomOf(c).toFixed(1) + "×";
  }
  // The preview's own style is the Desktop crop; Tablet and Phone come from the rules above.
  const base = cropCss(id);
  document.querySelectorAll(`#site img[data-slot="${id}"], #site video[data-slot="${id}"]`).forEach((im) => { im.style.objectPosition = ""; im.style.transform = ""; im.style.transformOrigin = ""; im.style.cssText += ";" + base; });
}
// Zoom: mouse wheel over the photo (or the − + buttons). Each pause counts as one change for Revert.
let zoomT = null, zoomSnapped = false;
function zoomBy(id, dz) {
  if (!zoomSnapped) { snap(id); zoomSnapped = true; }
  const c = cropAt(id, S.device) || { x: 50, y: 50 };
  setCropAt(id, S.device, { x: c.x, y: c.y, z: Math.round(Math.min(3, Math.max(1, zoomOf(c) + dz)) * 100) / 100 });
  applyCrop(id);
  clearTimeout(zoomT); zoomT = setTimeout(() => { zoomSnapped = false; save(); renderCards(); }, 600);
}
document.addEventListener("wheel", (e) => {
  const el = e.target.closest?.("[data-crop]"); if (!el) return;
  e.preventDefault();
  zoomBy(el.dataset.crop, -e.deltaY * 0.0015);
}, { passive: false });
document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest("[data-crop]"); if (!el || e.button > 0) return;
  e.preventDefault(); snap(el.dataset.crop); cropping = { id: el.dataset.crop, el }; el.setPointerCapture?.(e.pointerId); setCrop(e);
});
document.addEventListener("pointermove", (e) => { if (cropping) setCrop(e); });
document.addEventListener("pointerup", () => { if (!cropping) return; cropping = null; save(); renderCards(); });

render();
