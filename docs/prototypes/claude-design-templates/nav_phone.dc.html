<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Global nav · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@200;300;400;500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2D6AA5}a:hover{color:#294079}
</style>
</helmet>
<nav data-template="nav" data-chrome="nav" style="width: 390px; height: 72px; box-sizing: border-box; padding: 20px; background: #1C2026; color: #FFFFFF; font-family: 'Saira', sans-serif; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a data-spot="logo" href="#" aria-label="ClearMark home"><img src="/_blob/1d5213958254da5e40e8a1cf382870ae" alt="ClearMark Training" style="height: 30px; width: auto; display: block"></a>
<button data-spot="menu" type="button" aria-label="{{menuLabel}}" aria-expanded="{{expanded}}" onClick="{{toggle}}" style="position: relative; width: 44px; height: 44px; margin-right: -6px; padding: 0; border: 0; background: transparent; color: #FFFFFF; cursor: pointer">
<span aria-hidden="true" style="position: absolute; left: 6px; top: 11px; width: 32px; height: 3px; border-radius: 2px; background: #FFFFFF; transition: transform 0.3s ease; transform: {{top}}"></span>
<span aria-hidden="true" style="position: absolute; left: 6px; top: 20px; width: 32px; height: 3px; border-radius: 2px; background: #FFFFFF; transition: opacity 0.2s ease; opacity: {{mid}}"></span>
<span aria-hidden="true" style="position: absolute; left: 6px; top: 29px; width: 32px; height: 3px; border-radius: 2px; background: #FFFFFF; transition: transform 0.3s ease; transform: {{bottom}}"></span>
</button>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":72}}'>
class Component extends DCLogic {
renderVals() {
const open = !!(this.state && this.state.open);
return {
toggle: () => this.setState({ open: !open }),
expanded: open ? 'true' : 'false',
menuLabel: open ? 'Close menu' : 'Open menu',
top: open ? 'translateY(9px) rotate(45deg)' : 'none',
mid: open ? '0' : '1',
bottom: open ? 'translateY(-9px) rotate(-45deg)' : 'none',
};
}
}
</script>
</body>
</html>
