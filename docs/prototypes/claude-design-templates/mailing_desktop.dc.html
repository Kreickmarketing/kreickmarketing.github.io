<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mailing list · desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@200;300;400;500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2D6AA5}a:hover{color:#294079}
</style>
</helmet>
<section data-template="mailing" style="width: 1280px; height: 440px; box-sizing: border-box; padding: 96px 64px; background: #FFFFFF; color: #1C2026; font-family: 'Saira', sans-serif">
<div data-spot="columns" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 16px; line-height: 16px; letter-spacing: 3px; font-weight: 700; text-transform: uppercase">Mailing list</p>
<h2 data-spot="headline" style="margin: 0; font-size: 52px; line-height: 48px; letter-spacing: -2px; font-weight: 700">Stay in the loop</h2>
<p data-spot="intro" style="margin: 0; font-size: 20px; line-height: 28px; color: #444D4D">Short, useful notes on making work visible. No spam.</p>
</div>
<form data-chrome="form" style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #444D4D">Name<input type="text" style="border: 1px solid #E1DDD5; border-radius: 8px; padding: 14px 16px; font: inherit; font-size: 16px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #444D4D">Email<input type="email" style="border: 1px solid #E1DDD5; border-radius: 8px; padding: 14px 16px; font: inherit; font-size: 16px"></label>
<button type="button" style="align-self: flex-start; border: 0; background: #DB1F3D; color: #FFFFFF; border-radius: 999px; padding: 14px 32px; font-family: 'Saira', sans-serif; font-size: 18px; font-weight: 700">Sign up</button>
</form>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
